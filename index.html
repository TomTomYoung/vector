<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ベクターエディタ</title>
    <style>
      /* 基本スタイル */
      body {
        margin: 0;
        padding: 0;
        font-family: sans-serif;
        display: flex;
        flex-direction: column;
        height: 100vh;
      }

      .header {
        background: #333;
        color: white;
        padding: 10px;
      }

      .header h1 {
        margin: 0;
        font-size: 1.5rem;
      }

      .content {
        flex: 1;
        display: flex;
        overflow: hidden;
      }

      .left-panel {
        width: 220px;
        background: #f2f2f2;
        border-right: 1px solid #ccc;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .toolbar {
        flex: 1;
        display: flex;
        flex-direction: column;
        padding: 10px;
        gap: 0;
        box-sizing: border-box;
      }

      .panel-group {
        display: flex;
        flex-direction: column;
        flex: 1;
        height: 100%;
        position: relative;
      }

      .panel-section {
        position: relative;
        flex: 0 0 auto;
        min-height: 140px;
        display: flex;
        flex-direction: column;
      }

      .panel-section-content {
        flex: 1;
        overflow-y: auto;
      }

      .panel-resizer {
        flex: 0 0 6px;
        height: 6px;
        background: #d4d4d4;
        border: 1px solid #c3c3c3;
        border-left: none;
        border-right: none;
        cursor: row-resize;
        margin: 6px 0;
      }

      .panel-resizer:hover,
      .panel-resizer.active {
        background: #bcbcbc;
      }

      body.resizing-panels {
        user-select: none;
        cursor: row-resize;
      }

      #tool-buttons-section {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 0;
        min-height: 0;
      }

      #tool-buttons-scroll {
        flex: 1;
        overflow-y: auto;
        border: 1px solid #ccc;
        background: #fff;
        padding: 5px;
        display: flex;
        flex-direction: column;
        gap: 5px;
      }

      #tool-buttons-scroll button {
        width: 100%;
        padding: 6px 8px;
        cursor: pointer;
      }

      #style-controls-container {
        border: 1px solid #ccc;
        background: #fff;
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        height: 100%;
        box-sizing: border-box;
        overflow-y: auto;
      }

      #style-controls-container button,
      #style-controls-container select,
      #style-controls-container input {
        width: 100%;
        box-sizing: border-box;
      }

      .style-inline-controls {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
      }

      .canvas-wrapper {
        flex: 1;
        display: flex;
        flex-direction: column;
      }

      .canvas-container {
        flex: 1;
        background: #e0e0e0;
        overflow: auto;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      #canvas {
        background: white;
        box-shadow: 0 0 5px rgba(0, 0, 0, 0.2);
      }

      .right-panel {
        width: 320px;
        background: #f7f7f7;
        border-left: 1px solid #ccc;
        display: flex;
        flex-direction: column;
        padding: 10px;
        box-sizing: border-box;
        gap: 0;
      }

      #tool-properties-panel {
        height: 100%;
        overflow-y: auto;
        border: 1px solid #ccc;
        background: #fff;
        padding: 15px;
        box-sizing: border-box;
      }

      #layer-panel-wrapper {
        height: 100%;
        border: 1px solid #ccc;
        background: #fff;
        padding: 10px;
        box-sizing: border-box;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .marquee-selection {
        fill: rgba(74, 144, 226, 0.15);
        stroke: #4a90e2;
        stroke-dasharray: 4 2;
        pointer-events: none;
      }

      .layer-panel-title {
        font-weight: bold;
        margin: 0;
      }

      #layer-container {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      #layer-list {
        flex: 1;
        overflow-y: auto;
        border: 1px solid #ddd;
        background: #fff;
        padding: 5px;
        box-sizing: border-box;
      }

      .layer-item {
        padding: 5px;
        margin-bottom: 5px;
        background-color: #f5f5f5;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        border-radius: 3px;
      }

      .layer-item.active {
        background-color: #e6f2ff;
      }

      .layer-row {
        display: flex;
        align-items: center;
        gap: 5px;
      }

      .layer-row button {
        padding: 2px 5px;
        font-size: 12px;
      }
    </style>
  </head>

  <body>
    <div class="header">
      <h1>ベクターエディタ</h1>
    </div>

    <div class="content">
      <aside class="left-panel">
        <div class="toolbar panel-group" data-panel-group="left">
          <div
            class="panel-section"
            data-initial-ratio="0.6"
            data-min-height="160"
          >
            <div class="panel-section-content" id="tool-buttons-section">
              <div id="tool-buttons-scroll">
                <!-- ツールボタンはJavaScriptで動的に追加されます -->
              </div>
            </div>
          </div>
          <div class="panel-resizer" data-panel-group="left"></div>
          <div
            class="panel-section"
            data-initial-ratio="0.4"
            data-min-height="160"
          >
            <div class="panel-section-content" id="style-controls-container"></div>
          </div>
        </div>
      </aside>

      <div class="canvas-wrapper">
        <div class="canvas-container">
          <svg id="canvas" width="800" height="600"></svg>
        </div>
      </div>

      <aside class="right-panel">
        <div class="panel-group" data-panel-group="right">
          <div
            class="panel-section"
            data-initial-ratio="0.6"
            data-min-height="200"
          >
            <div class="panel-section-content">
              <div id="tool-properties-panel"></div>
            </div>
          </div>
          <div class="panel-resizer" data-panel-group="right"></div>
          <div
            class="panel-section"
            data-initial-ratio="0.4"
            data-min-height="160"
          >
            <div class="panel-section-content" id="layer-panel-wrapper">
              <!-- レイヤーGUIがここに配置されます -->
            </div>
          </div>
        </div>
      </aside>
    </div>

    <!-- JavaScriptファイルの読み込み（順序が重要です） -->
    <!-- コアシステム -->
    <script src="src/core/BaseTool.js"></script>
    <script src="src/core/ToolManager.js"></script>
    <script src="src/core/SnapManager.js"></script>

    <!-- ツール -->
    <script src="src/tools/SelectTool.js"></script>
    <script src="src/tools/LineTool.js"></script>
    <script src="src/tools/RectangleTool.js"></script>
    <script src="src/tools/CircleTool.js"></script>
    <script src="src/tools/ArcTool.js"></script>
    <script src="src/tools/PolygonTool.js"></script>
    <script src="src/tools/PathTool.js"></script>
    <script src="src/tools/SplineTool.js"></script>
    <script src="src/tools/PolylineTool.js"></script>
    <script src="src/tools/TextTool.js"></script>
    <script src="src/tools/DimensionTool.js"></script>
    <script src="src/tools/OffsetTool.js"></script>
    <script src="src/tools/TrimTool.js"></script>
    <script src="src/tools/ExtendTool.js"></script>
    <script src="src/tools/FilletTool.js"></script>
    <script src="src/tools/ChamferTool.js"></script>
    <script src="src/tools/SplitTool.js"></script>
    <script src="src/tools/JoinTool.js"></script>

    <!-- UI コンポーネント -->
    <script src="src/ui/LayerPanel.js"></script>
    <script src="src/ui/StylePanel.js"></script>
    <script src="src/ui/GridManager.js"></script>
    <script src="src/ui/HistoryManager.js"></script>
    <script src="src/ui/AlignmentPanel.js"></script>
    <script src="src/ui/FileManager.js"></script>
    <script src="src/ui/ZoomPanManager.js"></script>
    <script src="src/ui/ToolPropertiesPanel.js"></script>
    <script src="src/ui/PanelLayoutManager.js"></script>

    <!-- アプリケーション -->
    <script src="src/core/App.js"></script>
    <script src="src/main.js"></script>
  </body>
</html>

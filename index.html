<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ベクターエディタ</title>
    <style>
      /* 基本スタイル */
      body {
        margin: 0;
        padding: 0;
        font-family: sans-serif;
        display: flex;
        flex-direction: column;
        height: 100vh;
      }

      .header {
        background: #333;
        color: white;
        padding: 10px;
      }

      .header h1 {
        margin: 0;
        font-size: 1.5rem;
      }

      .content {
        flex: 1;
        display: flex;
        overflow: hidden;
      }

      .left-panel {
        width: 220px;
        background: #f2f2f2;
        border-right: 1px solid #ccc;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        gap: 10px;
        padding: 10px;
        box-sizing: border-box;
      }

      .vertical-resizer {
        flex: 0 0 8px;
        width: 8px;
        background: #d4d4d4;
        border-left: 1px solid #c3c3c3;
        border-right: 1px solid #c3c3c3;
        cursor: col-resize;
        transition: background 0.2s ease;
        align-self: stretch;
      }

      .vertical-resizer:hover,
      .vertical-resizer.active {
        background: #bcbcbc;
      }

      body.resizing-columns {
        user-select: none;
        cursor: col-resize;
      }

      .toolbar {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 10px;
        box-sizing: border-box;
        overflow: hidden;
      }

      #tool-buttons-section,
      #style-controls-section {
        display: flex;
        flex-direction: column;
        flex: 1 1 0;
        min-height: 0;
      }

      .panel-card {
        border: 1px solid #b8b8b8;
        border-radius: 8px;
        background: #ffffff;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
        display: flex;
        flex-direction: column;
        min-height: 0;
      }

      .panel-card__header {
        padding: 8px 12px;
        font-weight: bold;
        background: linear-gradient(90deg, #f0f4ff, #e0eaff);
        border-bottom: 1px solid #d6dbe8;
      }

      .panel-card__body {
        padding: 10px;
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }

      .panel-group {
        display: flex;
        flex-direction: column;
        flex: 1;
        height: 100%;
        position: relative;
      }

      .panel-section {
        position: relative;
        flex: 0 0 auto;
        min-height: 140px;
        display: flex;
        flex-direction: column;
        border: 1px solid #b8b8b8;
        border-radius: 8px;
        background: #ffffff;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
        overflow: hidden;
      }

      .panel-section-header {
        padding: 8px 12px;
        font-weight: bold;
        background: linear-gradient(90deg, #fef6e4, #f9d8b8);
        border-bottom: 1px solid #ecd2b1;
      }

      .panel-section-content {
        flex: 1;
        overflow-y: auto;
        padding: 10px;
        box-sizing: border-box;
      }

      .panel-resizer {
        flex: 0 0 6px;
        height: 6px;
        background: #d4d4d4;
        border: 1px solid #c3c3c3;
        border-left: none;
        border-right: none;
        cursor: row-resize;
        margin: 6px 0;
      }

      .panel-resizer:hover,
      .panel-resizer.active {
        background: #bcbcbc;
      }

      body.resizing-panels {
        user-select: none;
        cursor: row-resize;
      }

      #tool-buttons-section {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 0;
        min-height: 0;
      }

      #tool-buttons-scroll {
        flex: 1;
        overflow-y: auto;
        border: 1px solid #dcdcdc;
        background: #fbfbfb;
        padding: 5px;
        display: flex;
        flex-direction: column;
        gap: 5px;
      }

      #style-controls-scroll {
        flex: 1;
        overflow-y: auto;
        border: 1px solid #dcdcdc;
        background: #fbfbfb;
        padding: 10px;
        box-sizing: border-box;
      }

      #style-controls-container {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      #tool-buttons-scroll button {
        width: 100%;
        padding: 6px 8px;
        cursor: pointer;
      }

      .canvas-wrapper {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        padding: 10px;
        box-sizing: border-box;
      }

      .canvas-panel .panel-card__body {
        padding: 0;
      }

      .canvas-panel {
        flex: 1;
        display: flex;
        flex-direction: column;
      }

      .canvas-container {
        flex: 1;
        width: 100%;
        height: 100%;
        background: #e0e0e0;
        overflow: auto;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        min-width: 0;
        min-height: 0;
        scrollbar-gutter: stable both-edges;
      }

      #canvas {
        background: white;
        box-shadow: 0 0 5px rgba(0, 0, 0, 0.2);
      }

      .right-panel {
        width: 320px;
        background: #f7f7f7;
        border-left: 1px solid #ccc;
        display: flex;
        flex-direction: column;
        padding: 10px;
        box-sizing: border-box;
        gap: 10px;
      }

      #tool-properties-panel {
        height: 100%;
        overflow-y: auto;
        border: 1px solid #ccc;
        background: #fff;
        padding: 15px;
        box-sizing: border-box;
      }

      #layer-panel-wrapper {
        height: 100%;
        border: 1px solid #ccc;
        background: #fff;
        padding: 10px;
        box-sizing: border-box;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .marquee-selection {
        fill: rgba(74, 144, 226, 0.15);
        stroke: #4a90e2;
        stroke-dasharray: 4 2;
        pointer-events: none;
      }

      .layer-panel-title {
        font-weight: bold;
        margin: 0;
      }

      #layer-container {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      #layer-list {
        flex: 1;
        overflow-y: auto;
        border: 1px solid #ddd;
        background: #fff;
        padding: 5px;
        box-sizing: border-box;
      }

      .layer-item {
        padding: 5px;
        margin-bottom: 5px;
        background-color: #f5f5f5;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        border-radius: 3px;
      }

      .layer-item.active {
        background-color: #e6f2ff;
      }

      .layer-row {
        display: flex;
        align-items: center;
        gap: 5px;
      }

      .layer-row button {
        padding: 2px 5px;
        font-size: 12px;
      }
    </style>
  </head>

  <body>
    <div class="header">
      <h1>ベクターエディタ</h1>
    </div>

    <div class="content">
        <aside class="left-panel">
          <div class="toolbar">
            <div id="tool-buttons-section" class="panel-card">
              <div class="panel-card__header">ツールパネル</div>
              <div class="panel-card__body">
                <div id="tool-buttons-scroll">
                  <!-- ツールボタンはJavaScriptで動的に追加されます -->
                </div>
              </div>
            </div>
            <div id="style-controls-section" class="panel-card">
              <div class="panel-card__header">コントロールパネル</div>
              <div class="panel-card__body">
                <div id="style-controls-scroll">
                  <div id="style-controls-container"></div>
                </div>
              </div>
            </div>
          </div>
        </aside>

      <div
        class="vertical-resizer"
        data-target="left-panel"
        data-direction="right"
      ></div>

        <div class="canvas-wrapper">
          <div class="panel-card canvas-panel">
            <div class="panel-card__header">キャンバスパネル</div>
            <div class="panel-card__body">
              <div class="canvas-container">
                <svg id="canvas" width="800" height="600"></svg>
              </div>
            </div>
          </div>
        </div>

      <div
        class="vertical-resizer"
        data-target="right-panel"
        data-direction="left"
      ></div>

      <aside class="right-panel" id="right-panel" data-min-width="220">
        <div class="panel-group" data-panel-group="right">
            <div
              class="panel-section"
              data-initial-ratio="0.6"
              data-min-height="200"
            >
              <div class="panel-section-header">ツールプロパティ</div>
              <div class="panel-section-content">
                <div id="tool-properties-panel"></div>
              </div>
            </div>
            <div class="panel-resizer" data-panel-group="right"></div>
            <div
              class="panel-section"
              data-initial-ratio="0.4"
              data-min-height="160"
            >
              <div class="panel-section-header">レイヤーパネル</div>
              <div class="panel-section-content">
                <div id="layer-panel-wrapper">
                  <!-- レイヤーGUIがここに配置されます -->
                </div>
              </div>
            </div>
          </div>
        </aside>
    </div>

    <!-- JavaScriptファイルの読み込み（順序が重要です） -->
    <!-- ユーティリティモジュール（ES6モジュール） -->
    <script type="module" src="src/utils/index.js"></script>

    <!-- コアシステム -->
    <script src="src/core/BaseTool.js"></script>
    <script src="src/core/ToolManager.js"></script>
    <script src="src/core/SnapManager.js"></script>

    <!-- ツール -->
    <script src="src/tools/BezierToolBase.js"></script>
    <script src="src/tools/SelectTool.js"></script>
    <script src="src/tools/LineTool.js"></script>
    <script src="src/tools/RectangleTool.js"></script>
    <script src="src/tools/CircleTool.js"></script>
    <script src="src/tools/ArcTool.js"></script>
    <script src="src/tools/PolygonTool.js"></script>
    <script src="src/tools/PathTool.js"></script>
    <script src="src/tools/SplineTool.js"></script>
    <script src="src/tools/QuadraticBezierTool.js"></script>
    <script src="src/tools/CubicBezierTool.js"></script>
    <script src="src/tools/NthBezierTool.js"></script>
    <script src="src/tools/PolylineTool.js"></script>
    <script src="src/tools/VerticesTool.js"></script>
    <script src="src/tools/TextTool.js"></script>
    <script src="src/tools/DimensionTool.js"></script>
    <script src="src/tools/OffsetTool.js"></script>
    <script src="src/tools/TrimTool.js"></script>
    <script src="src/tools/ExtendTool.js"></script>
    <script src="src/tools/FilletTool.js"></script>
    <script src="src/tools/ChamferTool.js"></script>
    <script src="src/tools/SplitTool.js"></script>
    <script src="src/tools/JoinTool.js"></script>

    <!-- UI コンポーネント -->
    <script src="src/ui/LayerPanel.js"></script>
    <script src="src/ui/GridManager.js"></script>
    <script src="src/ui/HistoryManager.js"></script>
    <script src="src/ui/AlignmentPanel.js"></script>
    <script src="src/ui/FileManager.js"></script>
    <script src="src/ui/ZoomPanManager.js"></script>
    <script src="src/ui/ToolPropertiesPanel.js"></script>
    <script src="src/ui/HorizontalPaneResizer.js"></script>
    <script src="src/ui/PanelLayoutManager.js"></script>

    <!-- アプリケーション -->
    <script src="src/core/App.js"></script>
    <script src="src/main.js"></script>
  </body>
</html>

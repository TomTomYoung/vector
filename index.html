<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ベクターエディタ</title>
    <style>
      /* 基本スタイル */
      body {
        margin: 0;
        padding: 0;
        font-family: sans-serif;
      }

      .header {
        background: #333;
        color: white;
        padding: 10px;
      }

      .toolbar {
        background: #eee;
        padding: 10px;
        display: flex;
      }

      .toolbar button {
        margin-right: 5px;
      }

      .canvas-container {
        background: #e0e0e0;
        height: calc(100vh - 100px);
        overflow: auto;
      }

      #canvas {
        background: white;
        margin: 20px;
      }
    </style>
  </head>

  <body>
    <div class="header">
      <h1>シンプルベクターエディタ</h1>
    </div>

    <div class="toolbar">
      <button id="select-tool">選択</button>
      <button id="rectangle-tool">長方形</button>
    </div>

    <div class="canvas-container">
      <svg id="canvas" width="800" height="600"></svg>
    </div>

    <script>
      // SVG名前空間
      const svgNS = "http://www.w3.org/2000/svg";
      const canvas = document.getElementById("canvas");

      // 状態変数
      let currentTool = "select"; // 現在選択しているツール
      let isDrawing = false; // 描画中フラグ
      let startPoint = { x: 0, y: 0 }; // 描画開始位置
      let drawingObject = null; // 描画中のオブジェクト
      let selectedObjects = []; // 複数選択用の配列

      // ツールボタン設定
      document.getElementById("select-tool").addEventListener("click", () => {
        currentTool = "select";
        updateToolButtons();
      });

      document
        .getElementById("rectangle-tool")
        .addEventListener("click", () => {
          currentTool = "rectangle";
          updateToolButtons();
        });

      function updateToolButtons() {
        // すべてのツールボタンの背景色をクリア
        document.querySelectorAll(".toolbar button").forEach((btn) => {
          btn.style.backgroundColor = "";
        });

        // currentTool に対応するボタンIDを決定
        let buttonId = "";
        switch (currentTool) {
          case "select":
            buttonId = "select-tool";
            break;
          case "rectangle":
            buttonId = "rectangle-tool";
            break;
          case "circle":
            buttonId = "circle-tool";
            break;
          case "polygon":
            buttonId = "polygon-tool";
            break;
          case "path":
            buttonId = "path-tool";
            break;
          case "text":
            buttonId = "text-tool";
            break;
          default:
            break;
        }

        // 対応するボタンの背景色を設定
        if (buttonId) {
          const btn = document.getElementById(buttonId);
          if (btn) btn.style.backgroundColor = "#ddd";
        }

        // ツール変更時に、多角形描画中のガイドラインが残っている場合の処理
        // ※多角形ツール以外に切り替えた場合、頂点数に応じて完成またはキャンセルする
        if (currentTool !== "polygon" && tempLine) {
          if (polygonPoints.length >= 3) {
            finishPolygon();
          } else {
            cancelPolygon();
          }
        }
      }

      // ダブルクリック時のイベントハンドラー（多角形・パスの描画完了用）
      function handleDoubleClick(event) {
        // 多角形描画中なら、頂点が3点以上の場合は完成、足りないならキャンセル
        if (currentTool === "polygon" && drawingObject) {
          if (polygonPoints.length >= 3) {
            finishPolygon();
          } else {
            cancelPolygon();
          }
        }
        // パス描画中なら、パスを完成させる
        else if (currentTool === "path" && currentPath) {
          finishPath();
        }
      }

      // 選択中のオブジェクトを削除する関数（削除前に状態保存）
      function deleteSelectedObject() {
        if (!selectedObject) return; // 選択オブジェクトがなければ何もしない

        saveState(); // 削除前に現在の状態を保存

        // キャンバスから選択オブジェクトを削除
        if (canvas.contains(selectedObject)) {
          canvas.removeChild(selectedObject);
        }

        // 選択状態とコントロールポイントをクリア
        deselectObject();
        selectedObjects = [];
      }

      // マウスイベント
      canvas.addEventListener("mousedown", startDrawing);
      canvas.addEventListener("mousemove", draw);
      canvas.addEventListener("mouseup", endDrawing);
      canvas.addEventListener("mouseleave", endDrawing);

      // メイン関数定義
      function startDrawing(event) {
        const rect = canvas.getBoundingClientRect();
        startPoint.x = event.clientX - rect.left;
        startPoint.y = event.clientY - rect.top;

        // ハンドルのチェック（変形機能）
        if (
          event.target.classList &&
          event.target.classList.contains("control-handle")
        ) {
          saveState();
          isResizing = true;
          resizeHandle = event.target;
          return;
        }

        if (
          event.target.classList &&
          event.target.classList.contains("rotate-handle")
        ) {
          saveState();
          isRotating = true;
          return;
        }

        // 操作開始時に現在の状態を保存（アンドゥ・リドゥ）
        if (currentTool !== "select") {
          saveState();
        }

        // ツール別の処理
        if (currentTool === "select") {
          handleSelection(event);
          if (selectedObject) {
            isDragging = true;
          }
        } else if (currentTool === "rectangle") {
          isDrawing = true;

          // 長方形を作成
          drawingObject = document.createElementNS(svgNS, "rect");
          drawingObject.setAttribute("x", startPoint.x);
          drawingObject.setAttribute("y", startPoint.y);
          drawingObject.setAttribute("width", 0);
          drawingObject.setAttribute("height", 0);
          drawingObject.setAttribute(
            "fill",
            document.getElementById("fill-color").value
          );
          drawingObject.setAttribute(
            "stroke",
            document.getElementById("stroke-color").value
          );
          drawingObject.setAttribute(
            "stroke-width",
            document.getElementById("stroke-width").value
          );
          drawingObject.setAttribute("data-layer", currentLayerId);

          canvas.appendChild(drawingObject);
        } else if (currentTool === "circle") {
          isDrawing = true;

          // 円を作成
          drawingObject = document.createElementNS(svgNS, "circle");
          drawingObject.setAttribute("cx", startPoint.x);
          drawingObject.setAttribute("cy", startPoint.y);
          drawingObject.setAttribute("r", 0);
          drawingObject.setAttribute(
            "fill",
            document.getElementById("fill-color").value
          );
          drawingObject.setAttribute(
            "stroke",
            document.getElementById("stroke-color").value
          );
          drawingObject.setAttribute(
            "stroke-width",
            document.getElementById("stroke-width").value
          );
          drawingObject.setAttribute("data-layer", currentLayerId);

          canvas.appendChild(drawingObject);
        } else if (currentTool === "polygon") {
          // クリックで頂点を追加
          const clickPoint = { x: startPoint.x, y: startPoint.y };
          handlePolygonClick(clickPoint);
        } else if (currentTool === "text") {
          // テキスト入力のプロンプト
          const textContent = prompt("テキストを入力してください:");
          if (textContent) {
            createTextElement(startPoint, textContent);
          }
        } else if (currentTool === "path") {
          // パス描画の処理（後で実装）
          handlePathClick(startPoint);
        }
      }

      function draw(event) {
        const rect = canvas.getBoundingClientRect();
        let currentX = event.clientX - rect.left;
        let currentY = event.clientY - rect.top;

        // スナップが有効ならグリッドにスナップ
        if (snapToGrid) {
          currentX = snapCoordinateToGrid(currentX);
          currentY = snapCoordinateToGrid(currentY);
        }

        // リサイズ処理
        if (isResizing) {
          resizeObject(event);
          return;
        }

        // 回転処理
        if (isRotating) {
          rotateObject(event);
          return;
        }

        // ドラッグ処理
        if (isDragging && selectedObject) {
          const dx = currentX - startPoint.x;
          const dy = currentY - startPoint.y;

          if (selectedObject.tagName === "rect") {
            const x = parseFloat(selectedObject.getAttribute("x")) + dx;
            const y = parseFloat(selectedObject.getAttribute("y")) + dy;
            selectedObject.setAttribute("x", x);
            selectedObject.setAttribute("y", y);
          } else if (selectedObject.tagName === "circle") {
            // 円の移動
            selectedObject.setAttribute(
              "cx",
              parseFloat(selectedObject.getAttribute("cx")) + dx
            );
            selectedObject.setAttribute(
              "cy",
              parseFloat(selectedObject.getAttribute("cy")) + dy
            );
          } else if (selectedObject.tagName === "polygon") {
            // 多角形の移動
            const points = selectedObject
              .getAttribute("points")
              .trim()
              .split(" ");
            const newPoints = points
              .map((point) => {
                const [x, y] = point.split(",").map(parseFloat);
                return `${x + dx},${y + dy}`;
              })
              .join(" ");
            selectedObject.setAttribute("points", newPoints);
          } else if (selectedObject.tagName === "text") {
            // テキストの移動
            selectedObject.setAttribute(
              "x",
              parseFloat(selectedObject.getAttribute("x")) + dx
            );
            selectedObject.setAttribute(
              "y",
              parseFloat(selectedObject.getAttribute("y")) + dy
            );
          } else if (selectedObject.tagName === "path") {
            // パスの移動
            // 未実装
          } else if (selectedObject.tagName === "g") {
            // グループの移動は transform 属性を使用
            let transform = selectedObject.getAttribute("transform") || "";

            if (transform.includes("translate")) {
              // 既存の移動がある場合は更新
              transform = transform.replace(
                /translate\([^)]+\)/,
                `translate(${dx}, ${dy})`
              );
            } else {
              // 新しい移動を追加
              transform += ` translate(${dx}, ${dy})`;
            }

            selectedObject.setAttribute("transform", transform.trim());
          }

          startPoint.x = currentX;
          startPoint.y = currentY;

          // コントロールポイントを更新
          if (selectedObject) {
            addControlPoints();
          }

          return;
        }

        // 描画中でなければ何もしない
        if (!isDrawing) return;

        // 描画処理
        if (currentTool === "rectangle") {
          // 長方形のサイズを更新
          const width = currentX - startPoint.x;
          const height = currentY - startPoint.y;

          // 正または負の値を処理
          let x = startPoint.x;
          let y = startPoint.y;
          let w = Math.abs(width);
          let h = Math.abs(height);

          if (width < 0) x = currentX;
          if (height < 0) y = currentY;

          drawingObject.setAttribute("x", x);
          drawingObject.setAttribute("y", y);
          drawingObject.setAttribute("width", w);
          drawingObject.setAttribute("height", h);
        } else if (currentTool === "circle") {
          const dx = currentX - startPoint.x;
          const dy = currentY - startPoint.y;
          const radius = Math.sqrt(dx * dx + dy * dy);
          drawingObject.setAttribute("r", radius);
        } else if (currentTool === "polygon") {
          // 多角形描画中のガイドライン更新
          if (polygonPoints.length > 0) {
            // 最後の頂点とマウス位置間のガイドラインを更新
            updateTemporaryLine(polygonPoints[polygonPoints.length - 1], {
              x: currentX,
              y: currentY,
            });
          }
        } else if (currentTool === "path") {
          // パス描画中の処理（実装必要）
        }
      }

      // 描画終了
      function endDrawing() {
        isDrawing = false;
        isDragging = false;
        isResizing = false;
        isRotating = false;

        if (currentTool !== "polygon" && currentTool !== "path") {
          drawingObject = null;
        }
      }

      //#region 選択機能

      // 選択オブジェクト追跡用
      let selectedObject = null;
      let isDragging = false;

      // 選択処理
      function handleSelection(event) {
        const target = event.target;

        // SVG要素が選択された場合
        if (target !== canvas) {
          selectObject(target);
        } else {
          deselectObject();
        }
      }

      // オブジェクト選択
      function selectObject(element) {
        if (selectedObject) {
          // 以前の選択を解除
          selectedObject.removeAttribute("stroke-dasharray");
        }

        selectedObject = element;
        selectedObject.setAttribute("stroke-dasharray", "5 5");
      }

      // 選択解除
      function deselectObject() {
        if (selectedObject) {
          selectedObject.removeAttribute("stroke-dasharray");
          selectedObject = null;
        }
      }

      //#endregion 選択機能

      //#region 削除機能

      // 削除ボタンを追加
      const toolbar = document.querySelector(".toolbar");
      const deleteBtn = document.createElement("button");
      deleteBtn.id = "delete-btn";
      deleteBtn.textContent = "削除";
      deleteBtn.addEventListener("click", deleteSelectedObject);
      toolbar.appendChild(deleteBtn);

      // 削除キーのイベントリスナー
      document.addEventListener("keydown", function (event) {
        if (event.key === "Delete" && selectedObject) {
          deleteSelectedObject();
        }
      });

      //#endregion 削除機能

      //#region 円

      // 円ツールのボタンを追加
      const circleBtn = document.createElement("button");
      circleBtn.id = "circle-tool";
      circleBtn.textContent = "円";
      circleBtn.addEventListener("click", () => {
        currentTool = "circle";
        updateToolButtons();
      });
      toolbar.insertBefore(circleBtn, deleteBtn);

      //#endregion 円

      //#region 多角形

      // 多角形ツールのボタンを追加
      const polygonBtn = document.createElement("button");
      polygonBtn.id = "polygon-tool";
      polygonBtn.textContent = "多角形";
      polygonBtn.addEventListener("click", () => {
        currentTool = "polygon";
        updateToolButtons();
      });
      toolbar.insertBefore(polygonBtn, deleteBtn);

      // 多角形描画用の変数
      let polygonPoints = []; // 頂点を保存する配列
      let tempLine = null; // 一時的なガイドライン

      // ダブルクリックイベントを追加（多角形の完了用）
      canvas.addEventListener("dblclick", handleDoubleClick);

      // 多角形描画のクリック処理
      function handlePolygonClick(point) {
        if (!drawingObject) {
          // 新しい多角形を開始
          drawingObject = document.createElementNS(svgNS, "polygon");
          drawingObject.setAttribute("fill", "#ffffff");
          drawingObject.setAttribute("stroke", "#000000");
          drawingObject.setAttribute("stroke-width", 2);
          canvas.appendChild(drawingObject);

          // 一時的なガイドラインを作成
          tempLine = document.createElementNS(svgNS, "line");
          tempLine.setAttribute("stroke", "#000000");
          tempLine.setAttribute("stroke-width", 1);
          tempLine.setAttribute("stroke-dasharray", "4 4");
          canvas.appendChild(tempLine);

          polygonPoints = []; // 頂点配列を初期化
        }

        // 頂点を追加
        polygonPoints.push(point);

        // ポリゴンのパスを更新
        updatePolygonPath();
      }

      // 多角形のパスを更新
      function updatePolygonPath() {
        if (!drawingObject || polygonPoints.length === 0) return;

        // 頂点をSVG形式に変換
        const pointsStr = polygonPoints.map((p) => `${p.x},${p.y}`).join(" ");
        drawingObject.setAttribute("points", pointsStr);
      }

      // ガイドラインの更新
      function updateTemporaryLine(start, end) {
        if (!tempLine) return;

        tempLine.setAttribute("x1", start.x);
        tempLine.setAttribute("y1", start.y);
        tempLine.setAttribute("x2", end.x);
        tempLine.setAttribute("y2", end.y);
      }

      // 多角形を完成させる
      function finishPolygon() {
        if (!drawingObject || polygonPoints.length < 3) {
          // 頂点が不足している場合はキャンセル
          cancelPolygon();
          return;
        }

        // ガイドラインを削除
        if (tempLine) {
          canvas.removeChild(tempLine);
          tempLine = null;
        }

        // 描画を完了
        isDrawing = false;
        drawingObject = null;
        polygonPoints = [];
      }

      // 多角形描画をキャンセル
      function cancelPolygon() {
        if (drawingObject) {
          canvas.removeChild(drawingObject);
        }

        if (tempLine) {
          canvas.removeChild(tempLine);
        }

        drawingObject = null;
        tempLine = null;
        polygonPoints = [];
      }

      // ESCキーで多角形描画をキャンセル
      document.addEventListener("keydown", function (event) {
        if (event.key === "Delete" && selectedObject) {
          deleteSelectedObject();
        }

        if (event.key === "Escape" && currentTool === "polygon" && tempLine) {
          cancelPolygon();
        }
      });

      //#endregion 多角形

      //#region パス描画

      // パスツールのボタンを追加
      const pathBtn = document.createElement("button");
      pathBtn.id = "path-tool";
      pathBtn.textContent = "パス";
      pathBtn.addEventListener("click", () => {
        currentTool = "path";
        updateToolButtons();
      });
      toolbar.insertBefore(pathBtn, deleteBtn);

      // パス描画用の変数
      let pathPoints = [];
      let currentPath = null;
      let pathMode = "line"; // 'line' または 'bezier'

      // パスモード切替ボタン
      const pathModeBtn = document.createElement("button");
      pathModeBtn.id = "path-mode-btn";
      pathModeBtn.textContent = "ベジェモード";
      pathModeBtn.addEventListener("click", () => {
        pathMode = pathMode === "line" ? "bezier" : "line";
        pathModeBtn.textContent =
          pathMode === "line" ? "ベジェモード" : "直線モード";
      });
      toolbar.insertBefore(pathModeBtn, deleteBtn);

      // パスのクリック処理
      function handlePathClick(point) {
        if (!currentPath) {
          // 新しいパスを開始
          pathPoints = [];
          currentPath = document.createElementNS(svgNS, "path");
          currentPath.setAttribute("fill", "none");
          currentPath.setAttribute(
            "stroke",
            document.getElementById("stroke-color").value
          );
          currentPath.setAttribute(
            "stroke-width",
            document.getElementById("stroke-width").value
          );
          currentPath.setAttribute("data-layer", currentLayerId);
          canvas.appendChild(currentPath);
        }

        // 頂点を追加
        pathPoints.push(point);

        // パスを更新
        updatePathData();
      }

      // パスデータの更新
      function updatePathData() {
        if (!currentPath || pathPoints.length === 0) return;

        let d = `M ${pathPoints[0].x} ${pathPoints[0].y}`;

        if (pathMode === "line") {
          // 直線パス
          for (let i = 1; i < pathPoints.length; i++) {
            d += ` L ${pathPoints[i].x} ${pathPoints[i].y}`;
          }
        } else {
          // ベジェ曲線パス（簡易版）
          for (let i = 1; i < pathPoints.length; i++) {
            if (i % 3 === 1) {
              // 制御点1と制御点2と終点で1つのベジェ曲線
              const cp1 = pathPoints[i];

              if (i + 2 < pathPoints.length) {
                const cp2 = pathPoints[i + 1];
                const endPoint = pathPoints[i + 2];
                d += ` C ${cp1.x} ${cp1.y}, ${cp2.x} ${cp2.y}, ${endPoint.x} ${endPoint.y}`;
              } else {
                // 制御点が足りない場合は直線
                d += ` L ${pathPoints[i].x} ${pathPoints[i].y}`;
              }
            } else if (i % 3 === 0) {
              // 終点はすでに処理済み
              continue;
            } else if (i % 3 === 2 && i + 1 >= pathPoints.length) {
              // 最後の制御点の場合は直線で結ぶ
              d += ` L ${pathPoints[i].x} ${pathPoints[i].y}`;
            }
          }
        }

        currentPath.setAttribute("d", d);
      }

      // パスを完成させる
      function finishPath() {
        // パスの作成を完了
        currentPath = null;
        pathPoints = [];
      }

      // ESCキーでパス描画をキャンセル
      document.addEventListener("keydown", function (event) {
        if (event.key === "Delete" && selectedObject) {
          deleteSelectedObject();
        }

        if (event.key === "Escape") {
          if (currentTool === "polygon" && tempLine) {
            cancelPolygon();
          } else if (currentTool === "path" && currentPath) {
            canvas.removeChild(currentPath);
            currentPath = null;
            pathPoints = [];
          }
        }
      });

      //#endregion パス描画

      //#region テキスト

      // テキストツールのボタンを追加
      const textBtn = document.createElement("button");
      textBtn.id = "text-tool";
      textBtn.textContent = "テキスト";
      textBtn.addEventListener("click", () => {
        currentTool = "text";
        updateToolButtons();
      });
      toolbar.insertBefore(textBtn, deleteBtn);

      // テキスト要素を作成
      function createTextElement(point, content) {
        const text = document.createElementNS(svgNS, "text");
        text.setAttribute("x", point.x);
        text.setAttribute("y", point.y);
        text.setAttribute("fill", "#000000");
        text.setAttribute("font-family", "Arial");
        text.setAttribute("font-size", "16px");
        text.textContent = content;

        canvas.appendChild(text);
      }

      //#endregion テキスト

      //#region 保存

      // 保存と読み込みボタンを追加
      const saveBtn = document.createElement("button");
      saveBtn.id = "save-btn";
      saveBtn.textContent = "保存";
      saveBtn.addEventListener("click", saveSVG);
      toolbar.appendChild(saveBtn);

      const loadBtn = document.createElement("button");
      loadBtn.id = "load-btn";
      loadBtn.textContent = "読み込み";
      loadBtn.addEventListener("click", loadSVG);
      toolbar.appendChild(loadBtn);

      // SVGを保存
      function saveSVG() {
        // 選択状態を解除
        deselectObject();

        // SVGのクローンを作成
        const svgCopy = canvas.cloneNode(true);

        // SVGデータをテキストに変換
        const svgData = new XMLSerializer().serializeToString(svgCopy);

        // ダウンロード用のリンクを作成
        const blob = new Blob([svgData], { type: "image/svg+xml" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = "drawing.svg";
        link.click();

        // リソースの解放
        URL.revokeObjectURL(url);
      }

      // SVGを読み込み
      function loadSVG() {
        // ファイル選択ダイアログを表示
        const input = document.createElement("input");
        input.type = "file";
        input.accept = ".svg";

        input.onchange = function (event) {
          const file = event.target.files[0];
          if (!file) return;

          const reader = new FileReader();
          reader.onload = function (e) {
            const svgContent = e.target.result;

            // キャンバスをクリア
            while (canvas.firstChild) {
              canvas.removeChild(canvas.firstChild);
            }

            // SVGを解析
            const parser = new DOMParser();
            const svgDoc = parser.parseFromString(svgContent, "image/svg+xml");

            // 要素をインポート
            const svgRoot = svgDoc.documentElement;
            for (let i = 0; i < svgRoot.children.length; i++) {
              const node = svgRoot.children[i];
              const importedNode = document.importNode(node, true);
              canvas.appendChild(importedNode);
            }
          };

          reader.readAsText(file);
        };

        input.click();
      }

      //#endregion 保存

      //#region 変形機能（拡大縮小と回転）

      // 変形用の変数
      let isResizing = false;
      let isRotating = false;
      let resizeHandle = null;
      let transformOrigin = { x: 0, y: 0 };

      // コントロールポイント（ハンドル）の追加
      function addControlPoints() {
        if (!selectedObject) return;

        // 一旦既存のコントロールポイントを削除
        removeControlPoints();

        // オブジェクトのバウンディングボックスを取得
        let bbox;

        if (selectedObject.tagName === "rect") {
          const x = parseFloat(selectedObject.getAttribute("x"));
          const y = parseFloat(selectedObject.getAttribute("y"));
          const width = parseFloat(selectedObject.getAttribute("width"));
          const height = parseFloat(selectedObject.getAttribute("height"));
          bbox = { x, y, width, height };
        } else if (selectedObject.tagName === "circle") {
          const cx = parseFloat(selectedObject.getAttribute("cx"));
          const cy = parseFloat(selectedObject.getAttribute("cy"));
          const r = parseFloat(selectedObject.getAttribute("r"));
          bbox = { x: cx - r, y: cy - r, width: r * 2, height: r * 2 };
        } else if (selectedObject.tagName === "polygon") {
          // 多角形のバウンディングボックスを計算
          const points = selectedObject
            .getAttribute("points")
            .trim()
            .split(" ");
          let minX = Infinity,
            minY = Infinity,
            maxX = -Infinity,
            maxY = -Infinity;

          points.forEach((point) => {
            const [x, y] = point.split(",").map(parseFloat);
            minX = Math.min(minX, x);
            minY = Math.min(minY, y);
            maxX = Math.max(maxX, x);
            maxY = Math.max(maxY, y);
          });

          bbox = { x: minX, y: minY, width: maxX - minX, height: maxY - minY };
        } else if (selectedObject.tagName === "text") {
          // テキストのバウンディングボックスはDOMのメソッドで取得
          const clientRect = selectedObject.getBBox();
          bbox = {
            x: clientRect.x,
            y: clientRect.y,
            width: clientRect.width,
            height: clientRect.height,
          };
        } else {
          return; // 未対応のオブジェクト
        }

        // 変形の中心点
        transformOrigin = {
          x: bbox.x + bbox.width / 2,
          y: bbox.y + bbox.height / 2,
        };

        // リサイズハンドルの位置
        const handlePositions = [
          { x: bbox.x, y: bbox.y, cursor: "nwse-resize", class: "nw" },
          {
            x: bbox.x + bbox.width,
            y: bbox.y,
            cursor: "nesw-resize",
            class: "ne",
          },
          {
            x: bbox.x,
            y: bbox.y + bbox.height,
            cursor: "nesw-resize",
            class: "sw",
          },
          {
            x: bbox.x + bbox.width,
            y: bbox.y + bbox.height,
            cursor: "nwse-resize",
            class: "se",
          },
        ];

        // リサイズハンドルを追加
        handlePositions.forEach((pos) => {
          const handle = document.createElementNS(svgNS, "rect");
          handle.setAttribute("x", pos.x - 4);
          handle.setAttribute("y", pos.y - 4);
          handle.setAttribute("width", 8);
          handle.setAttribute("height", 8);
          handle.setAttribute("fill", "white");
          handle.setAttribute("stroke", "black");
          handle.setAttribute("cursor", pos.cursor);
          handle.classList.add("control-handle", pos.class);
          canvas.appendChild(handle);
        });

        // 回転ハンドル
        const rotateHandle = document.createElementNS(svgNS, "circle");
        rotateHandle.setAttribute("cx", bbox.x + bbox.width / 2);
        rotateHandle.setAttribute("cy", bbox.y - 20);
        rotateHandle.setAttribute("r", 5);
        rotateHandle.setAttribute("fill", "white");
        rotateHandle.setAttribute("stroke", "black");
        rotateHandle.setAttribute("cursor", "pointer");
        rotateHandle.classList.add("rotate-handle");
        canvas.appendChild(rotateHandle);

        // 回転ハンドルと中心を結ぶ線
        const rotateLine = document.createElementNS(svgNS, "line");
        rotateLine.setAttribute("x1", bbox.x + bbox.width / 2);
        rotateLine.setAttribute("y1", bbox.y);
        rotateLine.setAttribute("x2", bbox.x + bbox.width / 2);
        rotateLine.setAttribute("y2", bbox.y - 20);
        rotateLine.setAttribute("stroke", "black");
        rotateLine.setAttribute("stroke-dasharray", "2 2");
        rotateLine.classList.add("rotate-line");
        canvas.appendChild(rotateLine);
      }

      // コントロールポイントの削除
      function removeControlPoints() {
        const handles = document.querySelectorAll(
          ".control-handle, .rotate-handle, .rotate-line"
        );
        handles.forEach((handle) => {
          canvas.removeChild(handle);
        });
      }

      // 選択時にコントロールポイントを追加
      function selectObject(element) {
        if (selectedObject) {
          // 以前の選択を解除
          selectedObject.removeAttribute("stroke-dasharray");
          removeControlPoints();
        }

        selectedObject = element;
        selectedObject.setAttribute("stroke-dasharray", "5 5");

        // 配列にも追加
        selectedObjects = [element];

        // スタイルを反映
        document.getElementById("fill-color").value =
          element.getAttribute("fill") || "#ffffff";
        document.getElementById("stroke-color").value =
          element.getAttribute("stroke") || "#000000";
        document.getElementById("stroke-width").value =
          element.getAttribute("stroke-width") || "2";

        // 透明度があれば反映
        if (document.getElementById("opacity-input")) {
          document.getElementById("opacity-input").value =
            element.getAttribute("opacity") || "1";
        }

        // コントロールポイントを追加
        addControlPoints();
      }
      // 選択解除時にコントロールポイントを削除
      function deselectObject() {
        if (selectedObject) {
          selectedObject.removeAttribute("stroke-dasharray");
          removeControlPoints();
          selectedObject = null;
        }
      }

      // リサイズ処理
      function resizeObject(event) {
        if (!isResizing || !selectedObject || !resizeHandle) return;

        const rect = canvas.getBoundingClientRect();
        const currentX = event.clientX - rect.left;
        const currentY = event.clientY - rect.top;

        let newX, newY, newWidth, newHeight;

        // 現在のサイズと位置を取得
        if (selectedObject.tagName === "rect") {
          newX = parseFloat(selectedObject.getAttribute("x"));
          newY = parseFloat(selectedObject.getAttribute("y"));
          newWidth = parseFloat(selectedObject.getAttribute("width"));
          newHeight = parseFloat(selectedObject.getAttribute("height"));
        } else if (selectedObject.tagName === "circle") {
          const cx = parseFloat(selectedObject.getAttribute("cx"));
          const cy = parseFloat(selectedObject.getAttribute("cy"));
          const r = parseFloat(selectedObject.getAttribute("r"));
          newX = cx - r;
          newY = cy - r;
          newWidth = r * 2;
          newHeight = r * 2;
        }
        // ...その他のオブジェクトタイプに対する処理

        // ハンドルの位置によってリサイズ方向を変更
        if (resizeHandle.classList.contains("nw")) {
          const dx = currentX - newX;
          const dy = currentY - newY;
          newX = currentX;
          newY = currentY;
          newWidth -= dx;
          newHeight -= dy;
        } else if (resizeHandle.classList.contains("ne")) {
          const dy = currentY - newY;
          newY = currentY;
          newWidth = currentX - newX;
          newHeight -= dy;
        } else if (resizeHandle.classList.contains("sw")) {
          const dx = currentX - newX;
          newX = currentX;
          newWidth -= dx;
          newHeight = currentY - newY;
        } else if (resizeHandle.classList.contains("se")) {
          newWidth = currentX - newX;
          newHeight = currentY - newY;
        }

        // サイズが負にならないようにする
        if (newWidth < 1) newWidth = 1;
        if (newHeight < 1) newHeight = 1;

        // オブジェクトのサイズを更新
        if (selectedObject.tagName === "rect") {
          selectedObject.setAttribute("x", newX);
          selectedObject.setAttribute("y", newY);
          selectedObject.setAttribute("width", newWidth);
          selectedObject.setAttribute("height", newHeight);
        } else if (selectedObject.tagName === "circle") {
          // 円は四角形のリサイズを半径に変換して適用
          const newRadius = Math.min(newWidth, newHeight) / 2;
          const newCX = newX + newRadius;
          const newCY = newY + newRadius;
          selectedObject.setAttribute("cx", newCX);
          selectedObject.setAttribute("cy", newCY);
          selectedObject.setAttribute("r", newRadius);
        }
        // ...その他のオブジェクトタイプに対する処理

        // コントロールポイントを更新
        addControlPoints();
      }

      // 回転処理
      function rotateObject(event) {
        if (!isRotating || !selectedObject) return;

        const rect = canvas.getBoundingClientRect();
        const currentX = event.clientX - rect.left;
        const currentY = event.clientY - rect.top;

        // 回転角度を計算
        const dx = currentX - transformOrigin.x;
        const dy = currentY - transformOrigin.y;
        const angle = Math.atan2(dy, dx) * (180 / Math.PI);

        // 回転の適用
        let transform = selectedObject.getAttribute("transform") || "";

        // 既存の回転があれば削除
        if (transform.includes("rotate")) {
          transform = transform.replace(/\s*rotate\([^)]*\)/, "");
        }

        // 新しい回転を適用
        transform += ` rotate(${angle}, ${transformOrigin.x}, ${transformOrigin.y})`;
        selectedObject.setAttribute("transform", transform.trim());

        // コントロールポイントを更新
        addControlPoints();
      }

      //#endregion 変形機能（拡大縮小と回転）

      //#region グリッドとスナップ

      // グリッド関連の変数
      let showGrid = false;
      let snapToGrid = false;
      const gridSize = 20;

      // グリッド関連のボタンを追加
      const gridBtn = document.createElement("button");
      gridBtn.id = "grid-btn";
      gridBtn.textContent = "グリッド";
      gridBtn.addEventListener("click", toggleGrid);
      toolbar.appendChild(gridBtn);

      const snapBtn = document.createElement("button");
      snapBtn.id = "snap-btn";
      snapBtn.textContent = "スナップ";
      snapBtn.addEventListener("click", toggleSnap);
      toolbar.appendChild(snapBtn);

      // グリッド表示の切り替え
      function toggleGrid() {
        showGrid = !showGrid;
        gridBtn.style.backgroundColor = showGrid ? "#ddd" : "";

        if (showGrid) {
          createGrid();
        } else {
          removeGrid();
        }
      }

      // スナップ機能の切り替え
      function toggleSnap() {
        snapToGrid = !snapToGrid;
        snapBtn.style.backgroundColor = snapToGrid ? "#ddd" : "";
      }

      // グリッドの作成
      function createGrid() {
        removeGrid(); // 既存のグリッドを削除

        const gridGroup = document.createElementNS(svgNS, "g");
        gridGroup.setAttribute("id", "grid");

        const width = parseInt(canvas.getAttribute("width"));
        const height = parseInt(canvas.getAttribute("height"));

        // 縦線
        for (let x = gridSize; x < width; x += gridSize) {
          const line = document.createElementNS(svgNS, "line");
          line.setAttribute("x1", x);
          line.setAttribute("y1", 0);
          line.setAttribute("x2", x);
          line.setAttribute("y2", height);
          line.setAttribute("stroke", "#ddd");
          line.setAttribute("stroke-width", 1);
          gridGroup.appendChild(line);
        }

        // 横線
        for (let y = gridSize; y < height; y += gridSize) {
          const line = document.createElementNS(svgNS, "line");
          line.setAttribute("x1", 0);
          line.setAttribute("y1", y);
          line.setAttribute("x2", width);
          line.setAttribute("y2", y);
          line.setAttribute("stroke", "#ddd");
          line.setAttribute("stroke-width", 1);
          gridGroup.appendChild(line);
        }

        // 一番背面に追加
        canvas.insertBefore(gridGroup, canvas.firstChild);
      }

      // グリッドの削除
      function removeGrid() {
        const grid = document.getElementById("grid");
        if (grid) {
          canvas.removeChild(grid);
        }
      }

      // グリッドへのスナップ関数
      function snapCoordinateToGrid(coord) {
        if (!snapToGrid) return coord;
        return Math.round(coord / gridSize) * gridSize;
      }

      //#endregion グリッドとスナップ

      //#region レイヤー

      // レイヤー関連の変数
      let layers = [{ id: 1, name: "レイヤー 1", visible: true }];
      let currentLayerId = 1;

      // レイヤーパネルを作成
      const layerPanel = document.createElement("div");
      layerPanel.style.position = "absolute";
      layerPanel.style.right = "10px";
      layerPanel.style.top = "60px";
      layerPanel.style.width = "150px";
      layerPanel.style.background = "white";
      layerPanel.style.border = "1px solid #ccc";
      layerPanel.style.padding = "10px";
      layerPanel.style.zIndex = "100";
      layerPanel.innerHTML = `
    <h3>レイヤー</h3>
    <div id="layer-list"></div>
    <button id="add-layer">レイヤー追加</button>
`;
      document.body.appendChild(layerPanel);

      // レイヤー一覧を更新
      function updateLayerList() {
        const layerList = document.getElementById("layer-list");
        layerList.innerHTML = "";

        layers.forEach((layer) => {
          const layerItem = document.createElement("div");
          layerItem.style.padding = "5px";
          layerItem.style.marginBottom = "5px";
          layerItem.style.backgroundColor =
            layer.id === currentLayerId ? "#e6f2ff" : "#f5f5f5";
          layerItem.style.cursor = "pointer";
          layerItem.style.display = "flex";
          layerItem.style.alignItems = "center";

          const visibilityCheckbox = document.createElement("input");
          visibilityCheckbox.type = "checkbox";
          visibilityCheckbox.checked = layer.visible;
          visibilityCheckbox.addEventListener("change", () => {
            layer.visible = visibilityCheckbox.checked;
            updateLayerVisibility();
          });

          const nameSpan = document.createElement("span");
          nameSpan.textContent = layer.name;
          nameSpan.style.marginLeft = "5px";
          nameSpan.style.flex = "1";

          layerItem.appendChild(visibilityCheckbox);
          layerItem.appendChild(nameSpan);

          layerItem.addEventListener("click", (e) => {
            if (e.target !== visibilityCheckbox) {
              currentLayerId = layer.id;
              updateLayerList();
            }
          });

          layerList.appendChild(layerItem);
        });
      }

      // レイヤーの表示/非表示を更新
      function updateLayerVisibility() {
        // 各オブジェクトに data-layer 属性を設定する処理が必要
        document.querySelectorAll("[data-layer]").forEach((el) => {
          const layerId = parseInt(el.getAttribute("data-layer"));
          const layer = layers.find((l) => l.id === layerId);

          if (layer) {
            el.style.display = layer.visible ? "inline" : "none";
          }
        });
      }

      // レイヤー追加ボタンのイベント処理
      document.getElementById("add-layer").addEventListener("click", () => {
        const newLayerId =
          layers.length > 0
            ? Math.max(...layers.map((layer) => layer.id)) + 1
            : 1;

        layers.push({
          id: newLayerId,
          name: `レイヤー ${newLayerId}`,
          visible: true,
        });

        currentLayerId = newLayerId;
        updateLayerList();
      });

      // オブジェクト作成時に現在のレイヤーIDを設定
      function createRectangle(x, y, width, height) {
        const rect = document.createElementNS(svgNS, "rect");
        // ...既存コード

        // レイヤー属性を追加
        rect.setAttribute("data-layer", currentLayerId);

        canvas.appendChild(rect);
        return rect;
      }

      // 他の図形作成関数にも同様にレイヤー属性を追加

      // 初期化
      updateLayerList();

      //#endregion レイヤー

      //#region アンドゥとリドゥ

      // アンドゥ/リドゥ関連の変数
      let undoStack = [];
      let redoStack = [];
      const MAX_STACK_SIZE = 20; // スタックの最大サイズ

      // アンドゥ/リドゥボタンを追加
      const undoBtn = document.createElement("button");
      undoBtn.id = "undo-btn";
      undoBtn.textContent = "元に戻す";
      undoBtn.disabled = true;
      undoBtn.addEventListener("click", undo);
      toolbar.appendChild(undoBtn);

      const redoBtn = document.createElement("button");
      redoBtn.id = "redo-btn";
      redoBtn.textContent = "やり直し";
      redoBtn.disabled = true;
      redoBtn.addEventListener("click", redo);
      toolbar.appendChild(redoBtn);

      // キーボードショートカットの追加
      document.addEventListener("keydown", function (event) {
        // Ctrl+Z: アンドゥ
        if (event.ctrlKey && event.key === "z") {
          event.preventDefault();
          undo();
        }

        // Ctrl+Y: リドゥ
        if (event.ctrlKey && event.key === "y") {
          event.preventDefault();
          redo();
        }
      });

      // 状態を保存する関数
      function saveState() {
        // 現在の状態をクローン
        const state = canvas.cloneNode(true);

        // アンドゥスタックに追加
        undoStack.push(state);

        // スタックが大きくなりすぎないように制限
        if (undoStack.length > MAX_STACK_SIZE) {
          undoStack.shift(); // 最も古い状態を削除
        }

        // リドゥスタックをクリア（新しい操作をしたため）
        redoStack = [];

        // ボタンの状態を更新
        updateUndoRedoButtons();
      }

      // アンドゥ関数
      function undo() {
        if (undoStack.length === 0) return;

        // 現在の状態をリドゥスタックに保存
        const currentState = canvas.cloneNode(true);
        redoStack.push(currentState);

        // 一つ前の状態を復元
        const previousState = undoStack.pop();

        // キャンバスをクリア
        while (canvas.firstChild) {
          canvas.removeChild(canvas.firstChild);
        }

        // 前の状態を復元
        Array.from(previousState.childNodes).forEach((node) => {
          canvas.appendChild(node.cloneNode(true));
        });

        // 選択を解除
        selectedObject = null;

        // ボタンの状態を更新
        updateUndoRedoButtons();
      }

      // リドゥ関数
      function redo() {
        if (redoStack.length === 0) return;

        // 現在の状態をアンドゥスタックに保存
        const currentState = canvas.cloneNode(true);
        undoStack.push(currentState);

        // 次の状態を復元
        const nextState = redoStack.pop();

        // キャンバスをクリア
        while (canvas.firstChild) {
          canvas.removeChild(canvas.firstChild);
        }

        // 次の状態を復元
        Array.from(nextState.childNodes).forEach((node) => {
          canvas.appendChild(node.cloneNode(true));
        });

        // 選択を解除
        selectedObject = null;

        // ボタンの状態を更新
        updateUndoRedoButtons();
      }

      // アンドゥ/リドゥボタンの状態を更新
      function updateUndoRedoButtons() {
        undoBtn.disabled = undoStack.length === 0;
        redoBtn.disabled = redoStack.length === 0;
      }

      //#endregion アンドゥとリドゥ

      //#region 整列

      // 整列ボタンを追加
      const alignLeftBtn = document.createElement("button");
      alignLeftBtn.textContent = "左揃え";
      alignLeftBtn.addEventListener("click", () => alignObjects("left"));
      toolbar.appendChild(alignLeftBtn);

      const alignCenterBtn = document.createElement("button");
      alignCenterBtn.textContent = "中央揃え";
      alignCenterBtn.addEventListener("click", () => alignObjects("center"));
      toolbar.appendChild(alignCenterBtn);

      const alignRightBtn = document.createElement("button");
      alignRightBtn.textContent = "右揃え";
      alignRightBtn.addEventListener("click", () => alignObjects("right"));
      toolbar.appendChild(alignRightBtn);

      const alignTopBtn = document.createElement("button");
      alignTopBtn.textContent = "上揃え";
      alignTopBtn.addEventListener("click", () => alignObjects("top"));
      toolbar.appendChild(alignTopBtn);

      const alignMiddleBtn = document.createElement("button");
      alignMiddleBtn.textContent = "垂直中央揃え";
      alignMiddleBtn.addEventListener("click", () => alignObjects("middle"));
      toolbar.appendChild(alignMiddleBtn);

      const alignBottomBtn = document.createElement("button");
      alignBottomBtn.textContent = "下揃え";
      alignBottomBtn.addEventListener("click", () => alignObjects("bottom"));
      toolbar.appendChild(alignBottomBtn);

      // 整列機能の実装
      function alignObjects(alignType) {
        if (selectedObjects.length <= 1) return;

        saveState(); // 状態を保存

        // 選択されたオブジェクトのバウンディングボックスを取得
        const bounds = selectedObjects.map((obj) => getBoundingBox(obj));

        // 整列の基準値を計算
        let referenceValue;

        switch (alignType) {
          case "left":
            referenceValue = Math.min(...bounds.map((b) => b.x));
            selectedObjects.forEach((obj, i) => {
              alignObjectHorizontally(obj, referenceValue, "left", bounds[i]);
            });
            break;
          case "center":
            referenceValue =
              bounds.reduce((sum, b) => sum + (b.x + b.width / 2), 0) /
              bounds.length;
            selectedObjects.forEach((obj, i) => {
              alignObjectHorizontally(obj, referenceValue, "center", bounds[i]);
            });
            break;
          case "right":
            referenceValue = Math.max(...bounds.map((b) => b.x + b.width));
            selectedObjects.forEach((obj, i) => {
              alignObjectHorizontally(obj, referenceValue, "right", bounds[i]);
            });
            break;
          case "top":
            referenceValue = Math.min(...bounds.map((b) => b.y));
            selectedObjects.forEach((obj, i) => {
              alignObjectVertically(obj, referenceValue, "top", bounds[i]);
            });
            break;
          case "middle":
            referenceValue =
              bounds.reduce((sum, b) => sum + (b.y + b.height / 2), 0) /
              bounds.length;
            selectedObjects.forEach((obj, i) => {
              alignObjectVertically(obj, referenceValue, "middle", bounds[i]);
            });
            break;
          case "bottom":
            referenceValue = Math.max(...bounds.map((b) => b.y + b.height));
            selectedObjects.forEach((obj, i) => {
              alignObjectVertically(obj, referenceValue, "bottom", bounds[i]);
            });
            break;
        }

        // コントロールポイントを更新
        if (selectedObject) {
          addControlPoints();
        }
      }

      // 水平方向の整列
      function alignObjectHorizontally(obj, reference, alignType, bounds) {
        if (obj.tagName === "rect") {
          let newX = bounds.x;
          if (alignType === "center") {
            newX = reference - bounds.width / 2;
          } else if (alignType === "right") {
            newX = reference - bounds.width;
          } else {
            newX = reference;
          }
          obj.setAttribute("x", newX);
        } else if (obj.tagName === "circle") {
          let newCX = bounds.x + bounds.width / 2;
          if (alignType === "left") {
            newCX = reference + bounds.width / 2;
          } else if (alignType === "right") {
            newCX = reference - bounds.width / 2;
          } else {
            newCX = reference;
          }
          obj.setAttribute("cx", newCX);
        } else if (obj.tagName === "polygon") {
          // 多角形の場合
          const points = obj.getAttribute("points").trim().split(" ");
          const dx =
            alignType === "left"
              ? reference - bounds.x
              : alignType === "right"
              ? reference - (bounds.x + bounds.width)
              : reference - (bounds.x + bounds.width / 2);

          const newPoints = points
            .map((point) => {
              const [x, y] = point.split(",").map(parseFloat);
              return `${x + dx},${y}`;
            })
            .join(" ");

          obj.setAttribute("points", newPoints);
        } else if (obj.tagName === "text") {
          // テキストの場合
          let newX = bounds.x;
          if (alignType === "center") {
            newX = reference - bounds.width / 2;
          } else if (alignType === "right") {
            newX = reference - bounds.width;
          } else {
            newX = reference;
          }
          obj.setAttribute("x", newX);
        } else if (obj.tagName === "path") {
          // パスの場合（実装が必要）
        }
      }

      // 垂直方向の整列（水平方向と同様）
      function alignObjectVertically(obj, reference, alignType, bounds) {
        if (obj.tagName === "rect") {
          let newY = bounds.y;
          if (alignType === "middle") {
            newY = reference - bounds.height / 2;
          } else if (alignType === "bottom") {
            newY = reference - bounds.height;
          } else {
            newY = reference;
          }
          obj.setAttribute("y", newY);
        } else if (obj.tagName === "circle") {
          let newCY = bounds.y + bounds.height / 2;
          if (alignType === "top") {
            newCY = reference + bounds.height / 2;
          } else if (alignType === "bottom") {
            newCY = reference - bounds.height / 2;
          } else {
            newCY = reference;
          }
          obj.setAttribute("cy", newCY);
        }
        // 他のオブジェクトタイプも同様に実装
      }

      // オブジェクトのバウンディングボックスを取得する関数
      function getBoundingBox(obj) {
        if (obj.tagName === "rect") {
          return {
            x: parseFloat(obj.getAttribute("x")),
            y: parseFloat(obj.getAttribute("y")),
            width: parseFloat(obj.getAttribute("width")),
            height: parseFloat(obj.getAttribute("height")),
          };
        } else if (obj.tagName === "circle") {
          const cx = parseFloat(obj.getAttribute("cx"));
          const cy = parseFloat(obj.getAttribute("cy"));
          const r = parseFloat(obj.getAttribute("r"));
          return {
            x: cx - r,
            y: cy - r,
            width: r * 2,
            height: r * 2,
          };
        } else if (obj.tagName === "polygon") {
          const points = obj.getAttribute("points").trim().split(" ");
          let minX = Infinity,
            minY = Infinity,
            maxX = -Infinity,
            maxY = -Infinity;

          points.forEach((point) => {
            const [x, y] = point.split(",").map(parseFloat);
            minX = Math.min(minX, x);
            minY = Math.min(minY, y);
            maxX = Math.max(maxX, x);
            maxY = Math.max(maxY, y);
          });

          return {
            x: minX,
            y: minY,
            width: maxX - minX,
            height: maxY - minY,
          };
        } else if (obj.tagName === "text") {
          const bbox = obj.getBBox();
          return {
            x: bbox.x,
            y: bbox.y,
            width: bbox.width,
            height: bbox.height,
          };
        }
        // デフォルト値
        return { x: 0, y: 0, width: 0, height: 0 };
      }

      // グループ関連のボタンを追加
      const groupBtn = document.createElement("button");
      groupBtn.textContent = "グループ化";
      groupBtn.addEventListener("click", groupObjects);
      toolbar.appendChild(groupBtn);

      const ungroupBtn = document.createElement("button");
      ungroupBtn.textContent = "グループ解除";
      ungroupBtn.addEventListener("click", ungroupObjects);
      toolbar.appendChild(ungroupBtn);

      // オブジェクトのグループ化
      function groupObjects() {
        if (selectedObjects.length <= 1) return;

        saveState(); // 状態を保存

        // グループ要素を作成
        const group = document.createElementNS(svgNS, "g");
        group.setAttribute("data-layer", currentLayerId);

        // 選択されたオブジェクトをグループに移動
        selectedObjects.forEach((obj) => {
          // 元の親からオブジェクトを削除
          obj.parentNode.removeChild(obj);

          // グループにオブジェクトを追加
          group.appendChild(obj);

          // 選択表示を解除
          obj.removeAttribute("stroke-dasharray");
        });

        // グループをキャンバスに追加
        canvas.appendChild(group);

        // 選択を更新
        selectedObjects = [group];
        selectedObject = group;

        // グループを選択状態にする
        group.setAttribute("stroke-dasharray", "5 5");

        // コントロールポイントを更新
        addControlPoints();
      }

      // グループ解除
      function ungroupObjects() {
        if (!selectedObject || selectedObject.tagName !== "g") return;

        saveState(); // 状態を保存

        const group = selectedObject;
        const layerId = group.getAttribute("data-layer") || currentLayerId;

        // グループ内の要素をキャンバスに移動
        const childNodes = Array.from(group.childNodes);

        childNodes.forEach((node) => {
          // グループから要素を削除
          group.removeChild(node);

          // レイヤー属性を設定
          node.setAttribute("data-layer", layerId);

          // キャンバスに直接追加
          canvas.appendChild(node);

          // 新しい選択対象として追加
          selectedObjects.push(node);
          node.setAttribute("stroke-dasharray", "5 5");
        });

        // 空になったグループを削除
        canvas.removeChild(group);

        // 最後の要素を現在の選択オブジェクトにする
        selectedObject =
          selectedObjects.length > 0
            ? selectedObjects[selectedObjects.length - 1]
            : null;

        // コントロールポイントを更新
        if (selectedObject) {
          addControlPoints();
        }
      }

      //#endregion 整列

      // スタイル設定用のコントロールを追加
      const styleControls = document.createElement("div");
      styleControls.style.marginLeft = "15px";
      styleControls.style.display = "flex";
      styleControls.style.alignItems = "center";

      // 塗りつぶし色
      const fillColorLabel = document.createElement("label");
      fillColorLabel.textContent = "塗り:";
      fillColorLabel.style.marginRight = "5px";

      const fillColorInput = document.createElement("input");
      fillColorInput.type = "color";
      fillColorInput.id = "fill-color";
      fillColorInput.value = "#ffffff";
      fillColorInput.style.marginRight = "10px";

      // 線の色
      const strokeColorLabel = document.createElement("label");
      strokeColorLabel.textContent = "線:";
      strokeColorLabel.style.marginRight = "5px";

      const strokeColorInput = document.createElement("input");
      strokeColorInput.type = "color";
      strokeColorInput.id = "stroke-color";
      strokeColorInput.value = "#000000";
      strokeColorInput.style.marginRight = "10px";

      // 線の太さ
      const strokeWidthLabel = document.createElement("label");
      strokeWidthLabel.textContent = "線幅:";
      strokeWidthLabel.style.marginRight = "5px";

      const strokeWidthSelect = document.createElement("select");
      strokeWidthSelect.id = "stroke-width";
      strokeWidthSelect.style.marginRight = "10px";

      const widths = [1, 2, 3, 5, 8];
      widths.forEach((width) => {
        const option = document.createElement("option");
        option.value = width;
        option.textContent = `${width}px`;
        if (width === 2) option.selected = true;
        strokeWidthSelect.appendChild(option);
      });

      // 透明度
      const opacityLabel = document.createElement("label");
      opacityLabel.textContent = "透明度:";
      opacityLabel.style.marginRight = "5px";

      const opacityInput = document.createElement("input");
      opacityInput.type = "range";
      opacityInput.min = "0";
      opacityInput.max = "1";
      opacityInput.step = "0.1";
      opacityInput.value = "1";
      opacityInput.id = "opacity-input";
      opacityInput.style.width = "80px";
      opacityInput.style.marginRight = "10px";

      // コントロールを追加
      styleControls.appendChild(fillColorLabel);
      styleControls.appendChild(fillColorInput);
      styleControls.appendChild(strokeColorLabel);
      styleControls.appendChild(strokeColorInput);
      styleControls.appendChild(strokeWidthLabel);
      styleControls.appendChild(strokeWidthSelect);
      styleControls.appendChild(opacityLabel);
      styleControls.appendChild(opacityInput);

      // ツールバーに追加
      toolbar.insertBefore(styleControls, deleteBtn);

      // 描画関数で色を反映
      function createRectangle(x, y, width, height) {
        const rect = document.createElementNS(svgNS, "rect");
        rect.setAttribute("x", x);
        rect.setAttribute("y", y);
        rect.setAttribute("width", width);
        rect.setAttribute("height", height);
        rect.setAttribute("fill", document.getElementById("fill-color").value);
        rect.setAttribute(
          "stroke",
          document.getElementById("stroke-color").value
        );
        rect.setAttribute(
          "stroke-width",
          document.getElementById("stroke-width").value
        );
        canvas.appendChild(rect);
        return rect;
      }

      // 同様に他の描画関数も更新

      // 選択したオブジェクトのスタイルを更新
      fillColorInput.addEventListener("change", updateSelectedObjectStyle);
      strokeColorInput.addEventListener("change", updateSelectedObjectStyle);
      strokeWidthSelect.addEventListener("change", updateSelectedObjectStyle);

      function updateSelectedObjectStyle() {
        if (!selectedObject) return;

        saveState(); // 状態を保存

        selectedObject.setAttribute(
          "fill",
          document.getElementById("fill-color").value
        );
        selectedObject.setAttribute(
          "stroke",
          document.getElementById("stroke-color").value
        );
        selectedObject.setAttribute(
          "stroke-width",
          document.getElementById("stroke-width").value
        );
        selectedObject.setAttribute(
          "opacity",
          document.getElementById("opacity-input").value
        );
      }

      // 初期化
      updateToolButtons();
    </script>
  </body>
</html>

name: Vector editor regression tests
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  editor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Geometry
        run: node --test tests/*.test.mjs
      - name: Browser interactions
        shell: bash
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/vector-server.log 2>&1 &
          trap 'kill $!' EXIT
          curl --silent --fail --retry 8 --retry-connrefused http://127.0.0.1:8765/tests/editor.html >/dev/null
          node tests/runBrowser.mjs

<!doctype html>
<meta charset="utf-8">
<title>Vector editor regression checks</title>
<pre id="result" data-status="running">Running…</pre>
<iframe id="app" width="1200" height="720"></iframe>
<script type="module">
const frame = document.querySelector("#app");
const result = document.querySelector("#result");
const loaded = new Promise(resolve => frame.addEventListener("load", resolve, {once:true}));
frame.src = "../index.html";
await loaded;
const w = frame.contentWindow, doc = w.document;
const canvas = doc.querySelector("#canvas");
const reports = [], errors = [];
w.addEventListener("error", event => errors.push(event.message));
const tick = () => new Promise(resolve => setTimeout(resolve, 0));
async function check(name, run) {
  try {
    errors.length = 0;
    await run();
    if (errors.length) throw Error(errors.splice(0).join("\n"));
    reports.push("PASS " + name);
  } catch (error) {
    reports.push("FAIL " + name + "\n" + error.stack + "\n" + errors.join("\n"));
  }
}
function assert(value, message) { if (!value) throw Error(message); }
function activate(name) { doc.getElementById(name + "-tool").click(); }
function mouse(type, x, y, target = canvas) {
  const p = new w.DOMPoint(x,y).matrixTransform(canvas.getScreenCTM());
  target.dispatchEvent(new w.MouseEvent(type, {clientX:p.x, clientY:p.y, button:0, bubbles:true}));
}
function click(x,y,target) {
  mouse("mousedown",x,y,target);
  mouse("mouseup",x,y,target);
}
function key(key, options = {}) {
  doc.dispatchEvent(new w.KeyboardEvent("keydown", {key, bubbles:true, cancelable:true, ...options}));
}
function fixture(content = "") {
  w.DrawingDocument.open('<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600">' + content + '</svg>');
  w.saveState();
}
await check("All 22 registered toolbar buttons activate", async () => {
  const buttons = [...doc.querySelectorAll("#tool-buttons-scroll button")];
  assert(buttons.length === 22, "registered " + buttons.length);
  for (const button of buttons) {
    button.click();
    assert(w.toolManager.activeToolName + "-tool" === button.id, button.id);
  }
});
await check("A polyline survives mouseup, Enter and one-step Undo/Redo", async () => {
  fixture(); await tick();
  activate("polyline");
  click(30,30); click(90,30); click(90,90); key("Enter"); await tick();
  const points = () => canvas.querySelector("polyline")?.points.length;
  assert(points() === 3, "three clicks must form one polyline");
  key("z", {ctrlKey:true}); await tick();
  assert(!points(), "undo must remove the polyline");
  key("Z", {ctrlKey:true,shiftKey:true}); await tick();
  assert(points() === 3, "redo must restore all three points");
});
await check("Polygon, spline and three-click arc commit their final points", async () => {
  fixture(); await tick();
  activate("polygon"); click(20,20); click(100,20); click(20,100); key("Enter");
  assert(canvas.querySelector("polygon")?.points.length === 3, "polygon");
  activate("spline"); click(250,200); click(300,210); click(350,250);
  mouse("dblclick",350,250);
  assert(canvas.querySelector("[data-spline-tool]"), "spline");
  activate("arc"); click(400,300); click(440,250); click(480,300);
  assert(canvas.querySelector("[data-arc-tool]"), "arc without mousemove");
});
await check("Trim by a boundary and preserve stroke, layer and helper-free output", async () => {
  fixture('<line id="a" x1="0" y1="60" x2="100" y2="60" stroke="black" stroke-width="7" stroke-dasharray="11 3" data-layer="2"/><line id="b" x1="50" y1="20" x2="50" y2="90" stroke="green" stroke-width="6"/>');
  await tick(); const a = doc.getElementById("a"), b = doc.getElementById("b");
  activate("trim"); click(50,25,b); key("Enter"); click(80,60,a); await tick();
  assert(a.x2.baseVal.value === 50, "trim result");
  assert(b.getAttribute("stroke-width") === "6" && b.getAttribute("stroke") === "green","boundary appearance");
  activate("select"); w.selectTool.selectObject(a); doc.getElementById("grid-btn").click();
  const exported = w.DrawingDocument.serialize();
  assert(!/data-vector-highlight|data-vector-selected|class="control-handle|id="grid"/.test(exported),"helper exported");
  assert(a.getAttribute("stroke-dasharray") === "11 3" && a.getAttribute("data-layer") === "2", "figure attributes");
  w.selectTool.deselectObject();
  assert(a.getAttribute("stroke-dasharray") === "11 3","deselection");
  doc.getElementById("grid-btn").click();
});
await check("Layers and editable vertex/index model survive reload; malformed XML preserves current drawing", async () => {
  fixture(); await tick();
  doc.getElementById("add-layer").click();
  const layer = w.layers.at(-1);
  layer.name = "配管"; layer.locked = true; layer.visible = false;
  activate("vertices"); click(200,100); click(260,160);
  const vt = w.verticesTool;
  vt.toggleIndexSelection(0); vt.toggleIndexSelection(1);
  const xml = w.DrawingDocument.serialize();
  fixture(); w.DrawingDocument.open(xml);
  assert(w.currentLayerId === layer.id && w.layers.at(-1).locked && !w.layers.at(-1).visible && w.layers.at(-1).name === "配管","layer metadata");
  assert(vt.handleElements.length === 2 && vt.getActiveIndice().points.join(",") === "0,1","vertex metadata");
  assert(vt.geometryElements.length === 1,"geometry binding");
  const stable = w.DrawingDocument.serialize();
  try { w.DrawingDocument.open("<svg><invalid"); } catch {}
  assert(w.DrawingDocument.serialize() === stable,"invalid input replaced drawing");
});
await check("Zoomed drawing uses SVG coordinates; focused text field keeps its undo shortcut", async () => {
  fixture(); await tick();
  w.zoomPanManager.setTransform(2,30,20);
  activate("rectangle"); mouse("mousedown",30,40); mouse("mousemove",80,90); mouse("mouseup",80,90);
  await tick();
  const rect = canvas.querySelector("[data-rectangle-tool]");
  assert(Math.abs(rect.width.baseVal.value-50) < 1 && Math.abs(rect.height.baseVal.value-50) < 1, "zoomed dimensions");
  const input = doc.createElement("input"); doc.body.append(input); input.focus();
  const event = new w.KeyboardEvent("keydown",{key:"z",ctrlKey:true,bubbles:true,cancelable:true});
  input.dispatchEvent(event);
  assert(!event.defaultPrevented && rect.isConnected,"field shortcut intercepted"); input.remove();
});
await check("Straight paths split and extend through transformed boundaries; curved paths are preserved", async () => {
  w.zoomPanManager.resetZoom();
  fixture('<path id="p" d="M10 10 h100" transform="translate(20 0)" stroke="black"/><polyline id="edge" points="150,0 150,40" stroke="blue"/>');
  await tick();
  const p = doc.getElementById("p"), edge = doc.getElementById("edge");
  activate("extend"); click(150,20,edge); key("Enter"); click(125,10,p); await tick();
  assert(Math.abs(p.getTotalLength()-120)<0.01, "extended to boundary");
  activate("split"); click(70,10,p); await tick();
  const pieces = canvas.querySelectorAll("path");
  assert(pieces.length === 2 && Math.abs(pieces[0].getTotalLength()-40)<0.01 &&
    Math.abs(pieces[1].getTotalLength()-80)<0.01, "local coordinates of split path");
});
await check("Freehand input sequences for line, circle, path, all Bezier degrees, text and dimensions", async () => {
  fixture(); await tick();
  for (const k of Object.keys(w.snapManager.snapEnabled)) w.snapManager.snapEnabled[k] = false;
  activate("line"); mouse("mousedown",10,20); mouse("mousemove",90,20); mouse("mouseup",90,20);
  assert(canvas.querySelector("line[data-line-tool]")?.x2.baseVal.value === 90,"line");
  activate("circle"); mouse("mousedown",140,120); mouse("mousemove",160,120); mouse("mouseup",160,120);
  assert(canvas.querySelector("circle[data-circle-tool]")?.r.baseVal.value === 20,"circle");
  activate("path"); click(10,150); click(90,150); key("Enter");
  assert(canvas.querySelector("path[data-path-tool]")?.getTotalLength() > 79,"path");
  for (const [name,count,attr] of [["quadraticBezier",3,"quadratic"],["cubicBezier",4,"cubic"],["nthBezier",5,"nth"]]) {
    activate(name);
    for (let i=0; i<count; i++) click(210+i*25,160+(i%2)*45);
    assert(canvas.querySelector("[data-"+attr+"-bezier-tool]"),name);
  }
  const prompt = w.prompt;
  try { w.prompt = () => "確認"; activate("text"); click(250,350); }
  finally { w.prompt = prompt; }
  assert(canvas.querySelector("text[data-text-tool]")?.textContent === "確認","text");
  activate("dimension"); click(100,350); click(180,350);
  assert([...canvas.querySelectorAll("text")].some(x=>x.textContent==="80.0"),"linear dimension");
});
await check("Offset, join, fillet and chamfer complete without changing the reference color to a highlight", async () => {
  const lines = '<line id="h" x1="30" y1="50" x2="100" y2="50" stroke="#234567" stroke-width="7"/><line id="v" x1="100" y1="50" x2="100" y2="100" stroke="#234567" stroke-width="7"/>';
  for (const name of ["offset","join","fillet","chamfer"]) {
    fixture(lines); await tick();
    const h = doc.getElementById("h"), v = doc.getElementById("v");
    activate(name); click(60,50,h);
    if (name === "offset") click(60,75);
    else click(100,80,v);
    if (name === "join") key("Enter");
    const tag = {offset:"line", join:"polyline", fillet:"path", chamfer:"line"}[name];
    const newShape = [...canvas.querySelectorAll(tag)].find(el => el !== h && el !== v);
    assert(newShape && newShape.getAttribute("stroke") === "#234567" && newShape.getAttribute("stroke-width") === "7",name);
  }
});
await check("Save SVG, reopen from the file input, undo the load and export a PNG", async () => {
  fixture('<circle id="before" cx="40" cy="50" r="20" data-layer="3" stroke-dasharray="8 2"/>');
  await tick();
  const anchor = w.HTMLAnchorElement.prototype, input = w.HTMLInputElement.prototype;
  const oldDownload = anchor.click, oldChoose = input.click;
  const download = buttonId => new Promise((resolve, reject) => {
    anchor.click = function () {
      const name = this.download;
      w.fetch(this.href).then(r => r.blob()).then(blob => resolve({name, blob}), reject);
    };
    doc.getElementById(buttonId).click();
  });
  try {
    w.selectTool.selectObject(doc.getElementById("before"));
    const svg = await download("save-btn");
    assert(svg.name === "drawing.svg" && (await svg.blob.text()).includes("data-vector-document"), "SVG download");
    assert(w.selectedObject?.id === "before", "saving changed selection");
    fixture('<rect id="after" width="50" height="50"/>');
    await tick();
    const read = new Promise(resolve => {
      input.click = function () {
        const files = new w.DataTransfer();
        files.items.add(new w.File([svg.blob], "drawing.svg", {type:"image/svg+xml"}));
        this.files = files.files;
        const observer = new w.MutationObserver(() => {
          if (doc.getElementById("before")) { observer.disconnect(); resolve(); }
        });
        observer.observe(canvas, {childList:true});
        this.dispatchEvent(new w.Event("change"));
      };
      doc.getElementById("load-btn").click();
    });
    await read; await tick();
    assert(w.layers.some(layer => layer.id === 3) && doc.getElementById("before").getAttribute("stroke-dasharray")==="8 2", "file round trip");
    key("z",{ctrlKey:true}); await tick();
    assert(doc.getElementById("after") && !doc.getElementById("before"), "undo file load");
    const png = await download("export-png-btn");
    const bytes = new Uint8Array(await png.blob.arrayBuffer());
    assert(png.name === "drawing.png" && bytes.slice(0,8).join() === "137,80,78,71,13,10,26,10", "PNG signature");
  } finally {
    anchor.click = oldDownload;
    input.click = oldChoose;
  }
});
await check("Perpendicular and tangent endpoints are computed from the line start", async () => {
  fixture('<line x1="0" y1="100" x2="200" y2="100" stroke="black"/><circle cx="300" cy="100" r="20" stroke="black"/>');
  await tick();
  for (const k of Object.keys(w.snapManager.snapEnabled)) w.snapManager.snapEnabled[k] = false;
  w.snapManager.snapEnabled.perpendicular = true;
  activate("line"); mouse("mousedown",40,40); mouse("mousemove",43,102); mouse("mouseup",43,102);
  let line = [...canvas.querySelectorAll("[data-line-tool]")].at(-1);
  assert(line.x2.baseVal.value === 40 && line.y2.baseVal.value === 100, "perpendicular foot");
  w.snapManager.snapEnabled.perpendicular = false; w.snapManager.snapEnabled.tangent = true;
  mouse("mousedown",340,100); mouse("mousemove",312,118); mouse("mouseup",312,118);
  line = [...canvas.querySelectorAll("[data-line-tool]")].at(-1);
  const got = {x:line.x2.baseVal.value, y:line.y2.baseVal.value};
  const origin = {x:line.x1.baseVal.value, y:line.y1.baseVal.value};
  // MouseEvent coordinates are pixel-quantized. Verify the circle and tangent
  // constraints against the actual start rather than the requested screen pixel.
  const radius = {x:got.x - 300, y:got.y - 100};
  const dot = radius.x * (origin.x - got.x) + radius.y * (origin.y - got.y);
  assert(Math.abs(Math.hypot(radius.x, radius.y) - 20) < 0.001 && Math.abs(dot) < 0.01 && radius.y > 0,
    "tangent constraints: " + JSON.stringify({origin, got, dot}));
});
await check("A second editor replaces input, dispatch, arithmetic, tool, renderer and controller at startup", async () => {
  const other = document.createElement("iframe");
  const index = new URL("../index.html", location.href);
  const original = await (await fetch(index)).text();
  const config = `
    window.calls = [];
    const defaultHost = window.VectorUtils.createEditorHost();
    const renderer = window.VectorUtils.createEditorHost({
      encodePath(shape, options) { calls.push("curve"); return defaultHost.encodePath(shape, options); },
    });
    const replacement = window.VectorUtils.createEditorHost({
      operations: {distance: () => 13},
      tools: {circle(input, ops) {
        calls.push("tool");
        return {kind:"circle", center:input.center, radius:ops.distance(input.center, input.point) + 1};
      }},
    });
    window.vectorEditorOptions = {
      readPoint: () => new DOMPoint(37,41),
      snap(point) { calls.push("snap"); return point; },
      save() { calls.push("save"); },
      execute(name,input) { calls.push(name); return replacement.execute(name,input); },
      render(shape,target,options) {
        calls.push("render");
        const element = renderer.render(shape,target,options);
        if (!element) return null;
        element.setAttribute("data-custom-render", "1"); return element;
      },
      controllers: {circle: class extends CircleTool { getTitle() { return "Custom circle"; } }},
      createManager(canvas, host) { calls.push("manager"); return new ToolManager(canvas, host); },
    };
  `;
  // Place configuration after the module loader is ready, before the app's DOMContentLoaded callback.
  const setup = '<script>document.addEventListener("DOMContentLoaded", () => {' + config + '});<\/script>';
  const loaded = new Promise(resolve => other.addEventListener("load", resolve, {once:true}));
  other.srcdoc = original.replace("<head>", '<head><base href="' + index + '">')
    .replace('<script src="src/main.js">', setup + '<script src="src/main.js">');
  document.body.appendChild(other);
  try {
    await loaded;
    const app = other.contentWindow, d = app.document, board = d.getElementById("canvas");
    const button = d.getElementById("circle-tool");
    assert(button.textContent === "Custom circle", "controller registration");
    button.click();
    for (const type of ["mousedown","mousemove","mouseup"]) {
      board.dispatchEvent(new app.MouseEvent(type, {bubbles:true, button:0, clientX:2,clientY:3}));
    }
    const shape = board.querySelector("circle[data-custom-render]");
    assert(shape && shape.cx.baseVal.value === 37 && shape.cy.baseVal.value === 41 && shape.r.baseVal.value === 14,
      "custom input, operation, tool and output reached the actual drawing");
    d.getElementById("quadraticBezier-tool").click();
    for (let i = 0; i < 3; i++) board.dispatchEvent(new app.MouseEvent("mousedown", {bubbles:true, button:0}));
    assert(board.querySelector("path[data-quadratic-bezier-tool][data-custom-render]"), "custom curve renderer");
    assert(["manager","circle","tool","snap","save","render","curve"].every(stage => app.calls.includes(stage)), "dispatch stages");
    assert(doc.querySelector("#circle-tool").textContent !== "Custom circle", "editors share no overrides");
  } finally { other.remove(); }
});
result.textContent = reports.join("\n");
result.dataset.status = reports.some(r => r.startsWith("FAIL")) ? "failed" : "passed";
</script>

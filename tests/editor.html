<!doctype html>
<meta charset="utf-8">
<title>Vector editor regression checks</title>
<pre id="result" data-status="running">Running…</pre>
<iframe id="app" width="1200" height="720"></iframe>
<script type="module">
const frame = document.querySelector("#app");
const result = document.querySelector("#result");
const loaded = new Promise(resolve => frame.addEventListener("load", resolve, {once:true}));
const editorURL=new URL('../index.html',location.href);
const editorHTML=await (await fetch(editorURL)).text();
function configuredEditor(options) {
  const setup='<script>document.addEventListener("DOMContentLoaded",()=>{window.vectorEditorOptions='+options+';});<\/script>';
  return editorHTML.replace('<head>','<head><base href="'+editorURL+'">').replace('<script src="src/main.js">',setup+'<script src="src/main.js">');
}
frame.srcdoc=configuredEditor('{preferences:false}');
await loaded;
const w = frame.contentWindow, doc = w.document;
const canvas = doc.querySelector("#canvas");
const reports = [], errors = [];
w.addEventListener("error", event => errors.push(event.message));
const tick = () => new Promise(resolve => setTimeout(resolve, 0));
async function check(name, run) {
  try {
    errors.length = 0;
    await run();
    if (errors.length) throw Error(errors.splice(0).join("\n"));
    reports.push("PASS " + name);
  } catch (error) {
    reports.push("FAIL " + name + "\n" + error.stack + "\n" + errors.join("\n"));
  }
  result.textContent = reports.join("\n");
}
function assert(value, message) { if (!value) throw Error(message); }
function activate(name) { doc.getElementById(name + "-tool").click(); }
function mouse(type, x, y, target = canvas) {
  const p = new w.DOMPoint(x,y).matrixTransform(canvas.getScreenCTM());
  target.dispatchEvent(new w.MouseEvent(type, {clientX:p.x, clientY:p.y, button:0, bubbles:true}));
}
function click(x,y,target) {
  mouse("mousedown",x,y,target);
  mouse("mouseup",x,y,target);
}
function key(key, options = {}) {
  doc.dispatchEvent(new w.KeyboardEvent("keydown", {key, bubbles:true, cancelable:true, ...options}));
}
function fixture(content = "") {
  w.DrawingDocument.open('<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600">' + content + '</svg>');
  w.saveState();
}
async function createWorkbench(options={storage:false},setup=''){
  const url=new URL('../geometry.html',location.href),html=await (await fetch(url)).text(),other=document.createElement('iframe');other.width=1100;other.height=700;
  const ready=new Promise(resolve=>other.addEventListener('load',resolve,{once:true}));
  const bootstrap='<script>window.vectorWorkbenchOptions='+JSON.stringify(options)+';window.__workbenchWorkerCount=0;const NativeWorker=Worker;window.Worker=class extends NativeWorker{constructor(...args){super(...args);window.__workbenchWorkerCount++;}};'+setup+'<\/script>';
  other.srcdoc=html.replace('<head>','<head><base href="'+url+'">'+bootstrap);document.body.append(other);await ready;
  const cw=other.contentWindow,get=id=>cw.document.getElementById(id);
  const choose=(id,value)=>{get(id).value=value;get(id).dispatchEvent(new cw.Event('change'));};
  const edit=text=>{get('input').value=text;get('input').dispatchEvent(new cw.Event('input'));};
  return {frame:other,w:cw,get,choose,edit,
    async run(){get('run').click();for(let i=0;i<200&&get('status').textContent==='計算中…';i++)await new Promise(r=>setTimeout(r,20));assert(get('status').textContent!=='計算中…','workbench completion');return get('output').textContent;},
    async importText(text){const files=new cw.DataTransfer();files.items.add(new cw.File([text],'session.json',{type:'application/json'}));get('session-file').files=files.files;await get('session-file').onchange();},
    async exportText(){let blob,filename;const create=cw.URL.createObjectURL,revoke=cw.URL.revokeObjectURL,click=cw.HTMLAnchorElement.prototype.click;
      cw.URL.createObjectURL=value=>{blob=value;return 'blob:workbench-test';};cw.URL.revokeObjectURL=()=>{};cw.HTMLAnchorElement.prototype.click=function(){filename=this.download;};
      try{get('session-export').click();assert(blob?.type==='application/json'&&filename==='vector-workbench-session.json','JSON download');return await blob.text();}finally{cw.URL.createObjectURL=create;cw.URL.revokeObjectURL=revoke;cw.HTMLAnchorElement.prototype.click=click;}
    },close(){other.remove();},
  };
}

await check("Perpendicular and tangent endpoints are computed from the line start", async () => {
  fixture('<line x1="0" y1="100" x2="200" y2="100" stroke="black"/><circle cx="300" cy="100" r="20" stroke="black"/>');
  await tick();
  for (const k of Object.keys(w.snapManager.snapEnabled)) w.snapManager.snapEnabled[k] = false;
  w.snapManager.snapEnabled.perpendicular = true;
  activate("line"); mouse("mousedown",40,40); mouse("mousemove",43,102); mouse("mouseup",43,102);
  let line = [...canvas.querySelectorAll("[data-line-tool]")].at(-1);
  assert(line.x2.baseVal.value === 40 && line.y2.baseVal.value === 100, "perpendicular foot");
  w.snapManager.snapEnabled.perpendicular = false; w.snapManager.snapEnabled.tangent = true;
  mouse("mousedown",340,100); mouse("mousemove",312,118); mouse("mouseup",312,118);
  line = [...canvas.querySelectorAll("[data-line-tool]")].at(-1);
  const got = {x:line.x2.baseVal.value, y:line.y2.baseVal.value};
  const origin = {x:line.x1.baseVal.value, y:line.y1.baseVal.value};
  // MouseEvent coordinates are pixel-quantized. Verify the circle and tangent
  // constraints against the actual start rather than the requested screen pixel.
  const radius = {x:got.x - 300, y:got.y - 100};
  const dot = radius.x * (origin.x - got.x) + radius.y * (origin.y - got.y);
  assert(Math.abs(Math.hypot(radius.x, radius.y) - 20) < 0.001 && Math.abs(dot) < 0.01 && radius.y > 0,
    "tangent constraints: " + JSON.stringify({origin, got, dot}));
});

await check("A second editor replaces input, dispatch, arithmetic, tool, renderer and controller at startup", async () => {
  const other = document.createElement("iframe");
  const index = new URL("../index.html", location.href);
  const original = await (await fetch(index)).text();
  const config = `
    window.calls = [];
    const defaultHost = window.VectorUtils.createEditorHost();
    const renderer = window.VectorUtils.createEditorHost({
      encodePath(shape, options) { calls.push("curve"); return defaultHost.encodePath(shape, options); },
    });
    const replacement = window.VectorUtils.createEditorHost({
      operations: {distance: () => 13},
      tools: {circle(input, ops) {
        calls.push("tool");
        return {kind:"circle", center:input.center, radius:ops.distance(input.center, input.point) + 1};
      }},
    });
    window.vectorEditorOptions = {
      preferences: false,
      readPoint: () => new DOMPoint(37,41),
      snap(point) { calls.push("snap"); return point; },
      save() { calls.push("save"); },
      execute(name,input) { calls.push(name); return replacement.execute(name,input); },
      render(shape,target,options) {
        calls.push("render");
        const element = renderer.render(shape,target,options);
        if (!element) return null;
        element.setAttribute("data-custom-render", "1"); return element;
      },
      controllers: {circle: class extends CircleTool { getTitle() { return "Custom circle"; } }},
      createManager(canvas, host) { calls.push("manager"); return new ToolManager(canvas, host); },
    };
  `;
  // Place configuration after the module loader is ready, before the app's DOMContentLoaded callback.
  const setup = '<script>document.addEventListener("DOMContentLoaded", () => {' + config + '});<\/script>';
  const loaded = new Promise(resolve => other.addEventListener("load", resolve, {once:true}));
  other.srcdoc = original.replace("<head>", '<head><base href="' + index + '">')
    .replace('<script src="src/main.js">', setup + '<script src="src/main.js">');
  document.body.appendChild(other);
  try {
    await loaded;
    const app = other.contentWindow, d = app.document, board = d.getElementById("canvas");
    const button = d.getElementById("circle-tool");
    assert(button.textContent === "Custom circle", "controller registration");
    button.click();
    for (const type of ["mousedown","mousemove","mouseup"]) {
      board.dispatchEvent(new app.MouseEvent(type, {bubbles:true, button:0, clientX:2,clientY:3}));
    }
    const shape = board.querySelector("circle[data-custom-render]");
    assert(shape && shape.cx.baseVal.value === 37 && shape.cy.baseVal.value === 41 && shape.r.baseVal.value === 14,
      "custom input, operation, tool and output reached the actual drawing");
    d.getElementById("quadraticBezier-tool").click();
    for (let i = 0; i < 3; i++) board.dispatchEvent(new app.MouseEvent("mousedown", {bubbles:true, button:0}));
    assert(board.querySelector("path[data-quadratic-bezier-tool][data-custom-render]"), "custom curve renderer");
    assert(["manager","circle","tool","snap","save","render","curve"].every(stage => app.calls.includes(stage)), "dispatch stages");
    assert(doc.querySelector("#circle-tool").textContent !== "Custom circle", "editors share no overrides");
  } finally { other.remove(); }
});

await check("Four composed geometry operations run in the workbench worker", async () => {
  const {frame:other}=await createWorkbench();
  try {
    const d = other.contentDocument, get = id => d.getElementById(id);
    async function execute(name, change) {
      get("tool").value = name;
      get("tool").dispatchEvent(new Event("change"));
      // Switching now restores drafts; each independent calculation case starts from its example.
      get("reset").click();
      if (change) get("input").value = JSON.stringify(change(JSON.parse(get("input").value)));
      const done = new Promise(resolve => {
        const observer = new MutationObserver(() => {
          if (get("status").textContent === "計算中…") return;
          observer.disconnect(); resolve();
        });
        observer.observe(get("status"), {childList:true});
      });
      get("run").click(); await done;
      return {value: JSON.parse(get("output").textContent), status: get("status").textContent};
    }
    const boundary = await execute("regionBoundary");
    assert(boundary.status === "完了" && boundary.value.rings.length === 2 && boundary.value.area === 12, "hole reconstructed");
    const mesh = await execute("constrainedDelaunay");
    assert(mesh.status === "完了" && mesh.value.triangles.length === 8, "mesh around hole");
    const curves = await execute("bezierIntersections");
    assert(curves.status === "完了" && curves.value.complete && curves.value.intersections.length === 2, "two curve intersections");
    const solver = await execute("solveConstraints");
    assert(solver.status === "完了" && solver.value.converged && solver.value.degreesOfFreedom === 0, "fixed origin constraints");
    const limited = await execute("bezierIntersections", () => ({
      first:[{x:-1,y:1},{x:0,y:-1},{x:1,y:1}], second:[{x:-1,y:-0.5},{x:0,y:1.5},{x:1,y:-0.5}], maxNodes:1,
    }));
    assert(limited.status.includes("未確定") && !limited.value.complete, "partial isolation is not labeled complete");
    const stalled = await execute("solveConstraints", input => ({...input,maxIterations:0}));
    assert(stalled.status.includes("収束しません") && !stalled.value.converged, "unconverged solution shown");
    const invalid = await execute("constrainedDelaunay", input => ({...input,edges:[[0,999]]}));
    assert(invalid.status.includes("入力条件") && invalid.value === null, "invalid constraint index reported");
    const recovered = await execute("solveConstraints");
    assert(recovered.value.converged && recovered.status === "完了", "worker recovers after invalid input");
  } finally {other.remove();}
});
await check('Properties switch the calculation and renderer, record approximation limits and survive SVG reload', async () => {

const linearDraftNames=['line','polyline','quadraticBezier','cubicBezier','nthBezier'];
const linearDraftPoints=[{x:80,y:100},{x:180,y:90},{x:220,y:180},{x:120,y:220},{x:300,y:240}];
const linearDraftCount={line:2,polyline:3,quadraticBezier:2,cubicBezier:3,nthBezier:4};
const linearDraftAttribute={line:'data-line-tool',polyline:'data-polyline-tool',quadraticBezier:'data-quadratic-bezier-tool',cubicBezier:'data-cubic-bezier-tool',nthBezier:'data-nth-bezier-tool'};
const draftKey=(app,key)=>app.d.dispatchEvent(new app.w.KeyboardEvent('keydown',{key,bubbles:true,cancelable:true}));
function makeLinearDraft(app,name){
  app.d.getElementById(name+'-tool').click();const tool=app.w.toolManager.tools[name];
  if(name==='line'){tool.operationMode='twoClick';parameterClick(app,80,100);parameterMouse(app,'mousemove',180,90);}
  else {if(name==='nthBezier')preferenceNumber(app,'次数 (n)',4);for(const p of linearDraftPoints.slice(0,linearDraftCount[name]))parameterClick(app,p.x,p.y);}
  return tool;
}
function finishLinearDraft(app,name){
  if(name==='line'||name==='polyline')constructionEnter(app);
  else {const p=linearDraftPoints[linearDraftCount[name]];parameterClick(app,p.x,p.y);}
}

await check('Five line and Bezier drafts roundtrip into a fresh editor and commit with original points, current methods and atomic undo',async()=>{
  const source=await preferenceEditor('{preferences:false}');let target;
  try{
    source.w.DrawingDocument.open('<svg xmlns="http://www.w3.org/2000/svg"><rect id="draft-kept" x="10" y="10" width="20" height="20"/></svg>');
    for(const name of linearDraftNames){makeLinearDraft(source,name);inputPresetAction(source,'record');await tick();assert(!source.w.DrawingDocument.capture().querySelector('['+linearDraftAttribute[name]+']'),'preview excluded '+name);draftKey(source,'Escape');}
    const saved=inputPresetState(source),xml=source.w.DrawingDocument.serialize();assert(Object.keys(saved.entries).length===5,'five records');
    target=await preferenceEditor('{preferences:false}');const host=target.w.toolManager.host,execute=host.execute;let calls=0;host.execute=(...args)=>{calls++;return execute(...args);};
    target.w.DrawingDocument.open(xml);target.w.saveState();await tick();assert(calls===0&&target.w.toolManager.activeToolName==='select','load performs no calculation');
    for(const name of linearDraftNames){
      target.d.getElementById(name+'-tool').click();if(name.includes('Bezier'))host.selectRenderer(name,'sampled',{sampleCount:16});
      const methods=JSON.stringify(host.exportPreferences()),history=target.w.undoStack.length;inputPresetAction(target,'restore');
      const tool=target.w.toolManager.tools[name];assert(JSON.stringify(tool.exportInputPreset())===JSON.stringify(saved.entries[name]),'input restored '+name);
      assert(!target.w.DrawingDocument.capture().querySelector('['+linearDraftAttribute[name]+']')&&target.w.undoStack.length===history,'restore remains a draft '+name);
      finishLinearDraft(target,name);await tick();const el=target.w.DrawingDocument.capture().querySelector('['+linearDraftAttribute[name]+']');assert(el,'committed '+name);
      if(name.includes('Bezier'))assert(JSON.parse(el.getAttribute('data-vector-implementation')).rendering.id==='sampled','selected rendering used '+name);
      assert(target.w.undoStack.length===history+1&&JSON.stringify(host.exportPreferences())===methods,'one step, unchanged methods '+name);
      target.w.undo();assert(!target.w.DrawingDocument.capture().querySelector('['+linearDraftAttribute[name]+']'),'undo '+name);target.w.redo();assert(target.w.DrawingDocument.capture().querySelector('['+linearDraftAttribute[name]+']'),'redo '+name);
    }
    assert(target.d.getElementById('draft-kept')&&JSON.stringify(inputPresetState(target))===JSON.stringify(saved),'artwork and saved drafts retained');
  }finally{source.element.remove();target?.element.remove();}
});

<!doctype html>
<meta charset="utf-8">
<title>Vector editor regression checks</title>
<pre id="result" data-status="running">Running…</pre>
<iframe id="app" width="1200" height="720"></iframe>
<script type="module">
const frame = document.querySelector("#app");
const result = document.querySelector("#result");
const loaded = new Promise(resolve => frame.addEventListener("load", resolve, {once:true}));
frame.src = "../index.html";
await loaded;
const w = frame.contentWindow, doc = w.document;
const canvas = doc.querySelector("#canvas");
const reports = [], errors = [];
w.addEventListener("error", event => errors.push(event.message));
const tick = () => new Promise(resolve => setTimeout(resolve, 0));
async function check(name, run) {
  try {
    await run();
    if (errors.length) throw Error(errors.splice(0).join("\n"));
    reports.push("PASS " + name);
  } catch (error) {
    reports.push("FAIL " + name + "\n" + error.stack);
  }
}
function assert(value, message) { if (!value) throw Error(message); }
function activate(name) { doc.getElementById(name + "-tool").click(); }
function mouse(type, x, y, target = canvas) {
  const p = new w.DOMPoint(x,y).matrixTransform(canvas.getScreenCTM());
  target.dispatchEvent(new w.MouseEvent(type, {clientX:p.x, clientY:p.y, button:0, bubbles:true}));
}
function click(x,y,target) {
  mouse("mousedown",x,y,target);
  mouse("mouseup",x,y,target);
}
function key(key, options = {}) {
  doc.dispatchEvent(new w.KeyboardEvent("keydown", {key, bubbles:true, cancelable:true, ...options}));
}
function fixture(content = "") {
  w.DrawingDocument.open('<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600">' + content + '</svg>');
  w.saveState();
}
await check("All 22 registered toolbar buttons activate", async () => {
  const buttons = [...doc.querySelectorAll("#tool-buttons-scroll button")];
  assert(buttons.length === 22, "registered " + buttons.length);
  for (const button of buttons) {
    button.click();
    assert(w.toolManager.activeToolName + "-tool" === button.id, button.id);
  }
});
await check("A polyline survives mouseup, Enter and one-step Undo/Redo", async () => {
  fixture(); await tick();
  activate("polyline");
  click(30,30); click(90,30); click(90,90); key("Enter"); await tick();
  const points = () => canvas.querySelector("polyline")?.points.length;
  assert(points() === 3, "three clicks must form one polyline");
  key("z", {ctrlKey:true}); await tick();
  assert(!points(), "undo must remove the polyline");
  key("Z", {ctrlKey:true,shiftKey:true}); await tick();
  assert(points() === 3, "redo must restore all three points");
});
await check("Polygon, spline and three-click arc commit their final points", async () => {
  fixture(); await tick();
  activate("polygon"); click(20,20); click(100,20); click(20,100); key("Enter");
  assert(canvas.querySelector("polygon")?.points.length === 3, "polygon");
  activate("spline"); click(250,200); click(300,210); click(350,250);
  mouse("dblclick",350,250);
  assert(canvas.querySelector("[data-spline-tool]"), "spline");
  activate("arc"); click(400,300); click(440,250); click(480,300);
  assert(canvas.querySelector("[data-arc-tool]"), "arc without mousemove");
});
await check("Trim by a boundary and preserve stroke, layer and helper-free output", async () => {
  fixture('<line id="a" x1="0" y1="60" x2="100" y2="60" stroke="black" stroke-width="7" stroke-dasharray="11 3" data-layer="2"/><line id="b" x1="50" y1="20" x2="50" y2="90" stroke="green" stroke-width="6"/>');
  await tick(); const a = doc.getElementById("a"), b = doc.getElementById("b");
  activate("trim"); click(50,25,b); key("Enter"); click(80,60,a); await tick();
  assert(a.x2.baseVal.value === 50, "trim result");
  assert(b.getAttribute("stroke-width") === "6" && b.getAttribute("stroke") === "green","boundary appearance");
  activate("select"); w.selectTool.selectObject(a); doc.getElementById("grid-btn").click();
  const exported = w.DrawingDocument.serialize();
  assert(!/data-vector-highlight|data-vector-selected|class="control-handle|id="grid"/.test(exported),"helper exported");
  assert(a.getAttribute("stroke-dasharray") === "11 3" && a.getAttribute("data-layer") === "2", "figure attributes");
  w.selectTool.deselectObject();
  assert(a.getAttribute("stroke-dasharray") === "11 3","deselection");
  doc.getElementById("grid-btn").click();
});
await check("Layers and editable vertex/index model survive reload; malformed XML preserves current drawing", async () => {
  fixture(); await tick();
  doc.getElementById("add-layer").click();
  const layer = w.layers.at(-1);
  layer.name = "配管"; layer.locked = true; layer.visible = false;
  activate("vertices"); click(200,100); click(260,160);
  const vt = w.verticesTool;
  vt.toggleIndexSelection(0); vt.toggleIndexSelection(1);
  const xml = w.DrawingDocument.serialize();
  fixture(); w.DrawingDocument.open(xml);
  assert(w.currentLayerId === layer.id && w.layers.at(-1).locked && !w.layers.at(-1).visible && w.layers.at(-1).name === "配管","layer metadata");
  assert(vt.handleElements.length === 2 && vt.getActiveIndice().points.join(",") === "0,1","vertex metadata");
  assert(vt.geometryElements.length === 1,"geometry binding");
  const stable = w.DrawingDocument.serialize();
  try { w.DrawingDocument.open("<svg><invalid"); } catch {}
  assert(w.DrawingDocument.serialize() === stable,"invalid input replaced drawing");
});
await check("Zoomed drawing uses SVG coordinates; focused text field keeps its undo shortcut", async () => {
  fixture(); await tick();
  w.zoomPanManager.setTransform(2,30,20);
  activate("rectangle"); mouse("mousedown",30,40); mouse("mousemove",80,90); mouse("mouseup",80,90);
  await tick();
  const rect = canvas.querySelector("[data-rectangle-tool]");
  assert(Math.abs(rect.width.baseVal.value-50) < 1 && Math.abs(rect.height.baseVal.value-50) < 1, "zoomed dimensions");
  const input = doc.createElement("input"); doc.body.append(input); input.focus();
  const event = new w.KeyboardEvent("keydown",{key:"z",ctrlKey:true,bubbles:true,cancelable:true});
  input.dispatchEvent(event);
  assert(!event.defaultPrevented && rect.isConnected,"field shortcut intercepted"); input.remove();
});
result.textContent = reports.join("\n");
result.dataset.status = reports.some(r => r.startsWith("FAIL")) ? "failed" : "passed";
</script>

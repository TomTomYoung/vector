<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>平面幾何の演算室 | vector</title>
  <style>
    :root { color-scheme: light dark; font: 16px/1.6 system-ui,sans-serif; }
    body { max-width: 72rem; margin: 2rem auto; padding: 0 1.25rem; }
    h1 { margin: .6rem 0 .2rem; } p { margin: .4rem 0 1.1rem; }
    .panes { display: grid; grid-template-columns: repeat(auto-fit,minmax(min(100%,22rem),1fr)); gap: 1.25rem; margin: 1rem 0; }
    label, h2 { display: block; font-size: 1rem; font-weight: 650; margin: 0 0 .3rem; }
    textarea, pre { font: .9rem/1.5 ui-monospace,monospace; width: 100%; box-sizing: border-box; height: 22rem;
      overflow: auto; tab-size: 2; border: 1px solid GrayText; border-radius: 4px; margin: 0; padding: .65rem; }
    select, button { font: inherit; max-width: 100%; padding: .25rem .55rem; } button { margin: .25rem .4rem .25rem 0; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; } output { display: block; min-height: 1.6em; }
  </style>
</head>
<body>
  <nav><a href="index.html">作図エディタへ</a></nav>
  <main><h1>平面幾何の演算室</h1>
    <p>演算を選び、例の座標や条件を書き換えて実行できます。角度はラジアンです。</p>
    <label for="tool">演算</label><select id="tool"></select>
    <div class="panes">
      <section><label for="input">入力 JSON</label><textarea id="input" spellcheck="false"></textarea></section>
      <section><h2>出力 JSON</h2><pre id="output" tabindex="0" aria-label="出力 JSON"></pre></section>
    </div>
    <button id="run" type="button">実行</button><button id="reset" type="button">入力例に戻す</button><button id="stop" type="button" disabled>中止</button>
    <output id="status" aria-live="polite"></output>
  </main>
  <script type="module" src="src/ui/GeometryWorkbench.js"></script>
</body>
</html>
